# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: OneGeo
subtitle: GEO 研究与优化 · 新乡洹拓科技有限公司旗下项目
description: OneGeo 是新乡洹拓科技有限公司旗下的 GEO（生成式引擎优化）项目，做实体一致性、内容结构化、抓取可达性、信源布局与持续监测，用被引用次数、描述准确率与来源分布衡量效果，不承诺排名。
keywords: GEO,生成式引擎优化,Generative Engine Optimization,AI搜索优化,大模型引用,内容结构化,llms.txt,新乡洹拓科技
author: 新乡洹拓科技有限公司     # 法律主体；对外品牌名是 OneGeo
language: zh-CN
timezone: Asia/Shanghai

# URL
## 线上域名。canonical / Open Graph / sitemap / JSON-LD 全部以它为准，
## 改错了会直接产出指向 localhost 的线上页面（2026-10-26 踩过一次）
url: https://www.onegeo.cn
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # 去掉 URL 末尾的 index.html，canonical 与主题内部链接形态一致（/about/ 而非 /about/index.html）
  trailing_html: false  # 去掉 .html 后缀

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Sitemap（hexo-generator-sitemap）
# 只收文章、页面、标签与分类的第 1 页；分页副本由 scripts/robots-meta.js 出 noindex
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hexo-theme-xongyi
## 站点级主题配置写在根目录 _config.hexo-theme-xongyi.yml（深度合并，升级主题不丢改动）

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
