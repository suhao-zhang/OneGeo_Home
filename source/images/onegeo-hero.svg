<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GEO 链路示意图：站点内容经抓取与结构化后被生成式引擎检索，并在回答中作为来源被引用">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="h-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="h-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="28" fill="url(#h-bg)"/>
  <circle cx="1080" cy="120" r="150" fill="#dbeafe" opacity=".55"/>
  <circle cx="120" cy="800" r="120" fill="#e0f2fe" opacity=".6"/>

  <!-- 左：站点内容 -->
  <g filter="url(#h-shadow)">
    <rect x="90" y="200" width="380" height="440" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="90" y="200" width="380" height="56" rx="20" fill="#f8fafc"/>
    <circle cx="122" cy="228" r="7" fill="#f87171"/><circle cx="144" cy="228" r="7" fill="#fbbf24"/><circle cx="166" cy="228" r="7" fill="#34d399"/>
    <rect x="196" y="216" width="240" height="24" rx="12" fill="#eff6ff"/>
  </g>
  <text x="122" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#0f172a">站点内容</text>
  <g fill="#cbd5e1">
    <rect x="122" y="340" width="316" height="14" rx="7"/>
    <rect x="122" y="368" width="286" height="14" rx="7"/>
    <rect x="122" y="396" width="300" height="14" rx="7"/>
  </g>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#1d4ed8">
    <rect x="122" y="432" width="150" height="38" rx="19" fill="#eff6ff"/><text x="142" y="458">结构化段落</text>
    <rect x="282" y="432" width="156" height="38" rx="19" fill="#eff6ff"/><text x="302" y="458">Schema 标记</text>
    <rect x="122" y="482" width="150" height="38" rx="19" fill="#eff6ff"/><text x="142" y="508">术语一致</text>
    <rect x="282" y="482" width="156" height="38" rx="19" fill="#eff6ff"/><text x="302" y="508">FAQ 问答</text>
  </g>
  <text x="122" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">robots.txt 放行 · sitemap · llms.txt</text>
  <text x="122" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">正文不依赖 JS 即可读取</text>

  <!-- 中：生成式引擎 -->
  <g filter="url(#h-shadow)">
    <circle cx="600" cy="420" r="118" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="600" cy="420" r="86" fill="url(#h-blue)"/>
    <circle cx="600" cy="420" r="60" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="3"/>
    <ellipse cx="600" cy="420" rx="25" ry="60" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.6"/>
    <path d="M544 398h112M544 442h112" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.6"/>
  </g>
  <text x="600" y="588" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#0f172a">生成式引擎</text>
  <text x="600" y="620" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">抓取 · 理解 · 检索</text>

  <!-- 连线 -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-dasharray="10 9">
    <path d="M478 420H478"/>
    <path d="M482 420h-2"/>
    <path d="M484 330C520 330 520 350 546 356"/>
    <path d="M484 510C520 510 520 492 546 486"/>
    <path d="M654 356C690 350 700 330 736 330"/>
    <path d="M654 486C690 492 700 510 736 510"/>
  </g>
  <g fill="#2563eb"><path d="M540 350l14 6-14 6z"/><path d="M540 474l14 6-14 6z"/><path d="M730 344l-14-6 14-6z" transform="translate(6,0)"/><path d="M730 480l-14 6 14 6z" transform="translate(6,0)"/></g>

  <!-- 右：AI 回答与引用 -->
  <g filter="url(#h-shadow)">
    <rect x="740" y="230" width="380" height="380" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="772" y="286" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#0f172a">用户提问</text>
  <rect x="772" y="302" width="316" height="46" rx="14" fill="#f1f5f9"/>
  <text x="790" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#475569">“这类产品哪家能做？”</text>
  <g fill="#cbd5e1">
    <rect x="772" y="372" width="316" height="13" rx="6.5"/>
    <rect x="772" y="398" width="292" height="13" rx="6.5"/>
    <rect x="772" y="424" width="304" height="13" rx="6.5"/>
  </g>
  <text x="772" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">来源</text>
  <g>
    <rect x="772" y="488" width="316" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="796" cy="510" r="8" fill="url(#h-blue)"/>
    <text x="816" y="517" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#1d4ed8">onegeo.cn · 方法说明</text>
  </g>
  <g opacity=".55">
    <rect x="772" y="544" width="316" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="796" cy="566" r="8" fill="#cbd5e1"/>
    <text x="816" y="573" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">其他被引用信源</text>
  </g>

  <!-- 底部标注 -->
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">
    <text x="90" y="742">① 让机器读得懂</text>
    <text x="330" y="742">② 让爬虫抓得到</text>
    <text x="576" y="742">③ 让引擎愿意引</text>
    <text x="822" y="742">④ 用固定问题集回测</text>
  </g>
  <rect x="90" y="762" width="1030" height="2" rx="1" fill="#dbeafe"/>
  <text x="90" y="806" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#334155">衡量口径：被引用次数 · 被描述准确率 · 来源分布（不承诺排名）</text>
</svg>
