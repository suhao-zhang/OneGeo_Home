<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="OneGeo">
  <defs>
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- 只用图形标记：主题在 logo 右侧还会渲染 .brand__name 文字，
       字标放进来会重复一次品牌名，且 currentColor 在 <img> 里不跟随暗色模式。 -->
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#og-mark)"/>
  <circle cx="26" cy="30" r="14" fill="none" stroke="#ffffff" stroke-opacity=".92" stroke-width="2.6"/>
  <ellipse cx="26" cy="30" rx="5.8" ry="14" fill="none" stroke="#ffffff" stroke-opacity=".62" stroke-width="2.2"/>
  <path d="M13.2 24.4h25.6M13.2 35.6h25.6" stroke="#ffffff" stroke-opacity=".62" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="40.5" cy="15.5" r="5" fill="#ffffff"/>
  <circle cx="40.5" cy="15.5" r="2.2" fill="#2563eb"/>
</svg>
