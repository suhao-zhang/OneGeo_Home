<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形机器人产量与标准数字口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">人形机器人 · 四组关键数字</text>
    <text x="72" y="114" font-size="14" fill="#64748b">工信部 2026 年 10 月披露</text>

    <!-- 四个数字卡片 -->
    <rect x="72" y="134" width="116" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="130" y="162" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">400+</text>
    <text x="130" y="184" font-size="11" fill="#3b82f6" text-anchor="middle">型号（上半年）</text>

    <rect x="200" y="134" width="116" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="258" y="162" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">4万+</text>
    <text x="258" y="184" font-size="11" fill="#16a34a" text-anchor="middle">产量（上半年）</text>

    <rect x="328" y="134" width="116" height="70" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="386" y="162" font-size="20" font-weight="700" fill="#854d0e" text-anchor="middle">10万</text>
    <text x="386" y="184" font-size="11" fill="#a16207" text-anchor="middle">预计全年产量</text>

    <rect x="456" y="134" width="116" height="70" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="514" y="162" font-size="20" font-weight="700" fill="#9d174d" text-anchor="middle">6项</text>
    <text x="514" y="184" font-size="11" fill="#be185d" text-anchor="middle">国家标准（首批）</text>

    <!-- 标题口径对比 -->
    <text x="72" y="238" font-size="14" font-weight="600" fill="#0f172a">同一事件的两种标题</text>
    <rect x="72" y="250" width="240" height="32" rx="6" fill="#2563eb"/>
    <text x="82" y="272" font-size="12" fill="#ffffff">上半年 4 万台，全年预计超 10 万台</text>
    <rect x="328" y="250" width="240" height="32" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="338" y="272" font-size="12" fill="#dc2626">人形机器人爆发！产量暴增</text>

    <text x="72" y="306" font-size="12" fill="#64748b">前者给出时间区间与绝对值，后者只给情绪化判断——模型引用时只有前者能回答"产量多少"</text>
  </g>
</svg>