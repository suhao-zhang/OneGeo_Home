<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AGENTS.md 与 llms.txt 的分工示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="36" width="560" height="288" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="82" font-size="23" font-weight="700" fill="#0f172a">两份给 AI 的说明书</text>
    <text x="72" y="108" font-size="15" fill="#64748b">一个管"怎么做"，一个管"读什么"</text>

    <rect x="72" y="130" width="236" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="88" y="158" font-size="16" font-weight="700" fill="#1d4ed8">AGENTS.md</text>
    <text x="88" y="180" font-size="13" fill="#475569">读者：编码代理</text>
    <text x="88" y="202" font-size="13" fill="#475569">命令唯一</text>
    <text x="88" y="224" font-size="13" fill="#475569">边界带后果</text>
    <text x="88" y="246" font-size="13" fill="#475569">完成定义可判定</text>
    <text x="88" y="268" font-size="12" fill="#94a3b8">在仓库里动手</text>

    <rect x="332" y="130" width="236" height="150" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="348" y="158" font-size="16" font-weight="700" fill="#15803d">llms.txt</text>
    <text x="348" y="180" font-size="13" fill="#475569">读者：检索代理</text>
    <text x="348" y="202" font-size="13" fill="#475569">站点定位</text>
    <text x="348" y="224" font-size="13" fill="#475569">关键页面分组</text>
    <text x="348" y="246" font-size="13" fill="#475569">更新频率与口径</text>
    <text x="348" y="268" font-size="12" fill="#94a3b8">在站点上找资料</text>

    <text x="72" y="306" font-size="12" fill="#64748b">共同目标：让机器第一步就知道该看什么、该按什么方式做</text>
  </g>
</svg>
