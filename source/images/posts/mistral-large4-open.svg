<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Mistral Large 4 开源口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">Mistral Large 4 · "Le Chonk" 开源</text>
    <text x="72" y="114" font-size="14" fill="#64748b">~1T 参数 · 52B 激活 · 100 万 Token 上下文 · 修改版 MIT</text>

    <!-- 参数卡片 -->
    <rect x="72" y="136" width="116" height="60" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="130" y="160" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">~1T</text>
    <text x="130" y="180" font-size="10" fill="#3b82f6" text-anchor="middle">总参数</text>

    <rect x="200" y="136" width="116" height="60" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="258" y="160" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">52B</text>
    <text x="258" y="180" font-size="10" fill="#16a34a" text-anchor="middle">激活参数</text>

    <rect x="328" y="136" width="116" height="60" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="386" y="160" font-size="18" font-weight="700" fill="#854d0e" text-anchor="middle">1M</text>
    <text x="386" y="180" font-size="10" fill="#a16207" text-anchor="middle">上下文长度</text>

    <rect x="456" y="136" width="116" height="60" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="514" y="160" font-size="18" font-weight="700" fill="#9d174d" text-anchor="middle">-47%</text>
    <text x="514" y="180" font-size="10" fill="#be185d" text-anchor="middle">Token 消耗降幅</text>

    <!-- 许可证口径 -->
    <rect x="72" y="212" width="500" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="236" font-size="13" font-weight="600" fill="#0f172a">"开源"的口径：修改版 MIT ≠ 标准 MIT</text>
    <text x="82" y="258" font-size="12" fill="#64748b">标准 MIT：任意使用、修改、分发，无限制</text>
    <text x="82" y="278" font-size="12" fill="#dc2626">修改版 MIT：可能附加使用限制（如商用需授权、禁止军事用途等）</text>
  </g>
</svg>