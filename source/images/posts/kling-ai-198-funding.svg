<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="可灵AI 198亿融资数字口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">可灵 AI · 198 亿融资</text>
    <text x="72" y="114" font-size="14" fill="#64748b">快手旗下 · 2026 年 AI 视频领域最大单轮融资之一</text>

    <!-- 数字卡片 -->
    <rect x="72" y="140" width="160" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="152" y="168" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle">198 亿</text>
    <text x="152" y="192" font-size="12" fill="#3b82f6" text-anchor="middle">融资金额（人民币）</text>

    <rect x="248" y="140" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="328" y="168" font-size="14" fill="#166534" text-anchor="middle">估值 = ？</text>
    <text x="328" y="192" font-size="12" fill="#16a34a" text-anchor="middle">融资 ≠ 估值</text>

    <rect x="424" y="140" width="144" height="70" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="496" y="168" font-size="14" fill="#854d0e" text-anchor="middle">轮次 = ？</text>
    <text x="496" y="192" font-size="12" fill="#a16207" text-anchor="middle">A 轮还是 Pre-IPO？</text>

    <!-- 口径检查 -->
    <rect x="72" y="226" width="500" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="250" font-size="13" font-weight="600" fill="#0f172a">GEO 口径检查</text>
    <text x="82" y="272" font-size="12" fill="#64748b">✓ 198 亿是单轮还是累计？ ✓ 估值是否同步披露？ ✓ 投资方是否列出？</text>
    <text x="82" y="288" font-size="12" fill="#dc2626">✗ 多数标题只写"198 亿"，省略轮次和估值——模型引用时信息不完整</text>
  </g>
</svg>