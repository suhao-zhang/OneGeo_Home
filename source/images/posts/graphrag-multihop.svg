      <text x="150" y="218" font-size="11" fill="#1e40af" text-anchor="middle">段落</text>
      <text x="150" y="300" font-size="12" fill="#64748b" text-anchor="middle">向量检索</text>
    </g>

    <path d="M224 204h46" stroke="#94a3b8" stroke-width="3"/>
    <path d="M266 196l10 8-10 8z" fill="#94a3b8"/>

    <g stroke="#0ea5e9" stroke-width="2.5" fill="none">
      <path d="M320 204l58-46M320 204l58 46M378 158l64 18M378 250l64-18M442 176l46 28M442 232l46-28"/>
    </g>
    <g>
      <circle cx="320" cy="204" r="16" fill="#0f172a"/>
      <circle cx="378" cy="158" r="13" fill="#0ea5e9"/>
      <circle cx="378" cy="250" r="13" fill="#0ea5e9"/>
      <circle cx="442" cy="176" r="13" fill="#38bdf8"/>
      <circle cx="442" cy="232" r="13" fill="#38bdf8"/>
      <circle cx="488" cy="204" r="13" fill="#7dd3fc"/>
    </g>
    <text x="320" y="209" font-size="10" fill="#ffffff" text-anchor="middle">实体</text>
    <text x="378" y="300" font-size="12" fill="#64748b" text-anchor="middle">图扩一跳</text>

    <text x="68" y="324" font-size="12" fill="#1d4ed8">"零搬迁 · 零冗余" —— 图是数据的投影，不是第二份数据</text>
  </g>
</svg>
