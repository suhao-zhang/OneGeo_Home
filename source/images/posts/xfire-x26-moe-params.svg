<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="讯飞星火 X2.6 MoE 参数标注口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">星火 X2.6 · 293B-A30B MoE</text>
    <text x="72" y="114" font-size="14" fill="#64748b">讯飞发布 · 全国产算力训练 · 参数标注口径</text>

    <!-- 参数拆解 -->
    <rect x="72" y="140" width="200" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="172" y="168" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle">293B</text>
    <text x="172" y="192" font-size="12" fill="#3b82f6" text-anchor="middle">总参数量（全部专家）</text>
    <text x="172" y="208" font-size="11" fill="#64748b" text-anchor="middle">模型占用的显存总量</text>

    <text x="288" y="180" font-size="16" fill="#94a3b8">→</text>

    <rect x="308" y="140" width="200" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="408" y="168" font-size="22" font-weight="700" fill="#166534" text-anchor="middle">30B</text>
    <text x="408" y="192" font-size="12" fill="#16a34a" text-anchor="middle">激活参数（每次推理）</text>
    <text x="408" y="208" font-size="11" fill="#64748b" text-anchor="middle">实际参与计算的参数量</text>

    <!-- 口径说明 -->
    <rect x="72" y="236" width="500" height="60" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="82" y="258" font-size="13" font-weight="600" fill="#854d0e">标题写 293B 还是 30B？取决于你想强调什么</text>
    <text x="82" y="278" font-size="12" fill="#a16207">293B 强调模型规模 → 对标 GPT-4 级；30B 强调推理效率 → 对标 Llama-70B 级</text>
  </g>
</svg>