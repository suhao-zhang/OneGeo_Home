<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="脑机接口数据集建设与内容结构化">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">数据集 · 结构化先行</text>
    <text x="72" y="112" font-size="15" fill="#64748b">脑机接口的数据，AI 能读到吗？</text>

    <!-- 大脑图标 -->
    <circle cx="160" cy="200" r="50" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <path d="M135 185 Q145 170 160 175 Q175 170 185 185 Q190 200 185 215 Q175 225 160 220 Q145 225 135 215 Q130 200 135 185" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="148" cy="195" r="3" fill="#a855f7"/>
    <circle cx="172" cy="195" r="3" fill="#a855f7"/>
    <circle cx="160" cy="210" r="3" fill="#a855f7"/>

    <!-- 数据流 -->
    <g stroke="#94a3b8" stroke-width="2" fill="none">
      <path d="M218 190 L280 190" marker-end="url(#arrowF)"/>
      <path d="M218 210 L280 210" marker-end="url(#arrowF)"/>
    </g>

    <!-- 数据集 -->
    <rect x="288" y="160" width="120" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="348" y="190" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">高质量</text>
    <text x="348" y="210" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">数据集</text>
    <text x="348" y="228" font-size="11" fill="#64748b" text-anchor="middle">标准化 · 可验证</text>

    <!-- 箭头到 AI -->
    <path d="M416 200 L470 200" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowF)"/>
    <defs>
      <marker id="arrowF" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <path d="M0 0 L6 2.5 L0 5" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- AI 引用 -->
    <rect x="478" y="168" width="90" height="64" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="523" y="196" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">AI</text>
    <text x="523" y="216" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">可引用</text>
  </g>
</svg>
