<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="美团 LongCat-2.5 参数口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">LongCat-2.5 · 1.6 万亿参数的三种读法</text>
    <text x="72" y="114" font-size="14" fill="#64748b">美团发布 · 多模态 MoE · 全国产算力训练</text>

    <!-- 三种口径 -->
    <rect x="72" y="136" width="160" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="152" y="160" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.6T</text>
    <text x="152" y="182" font-size="11" fill="#3b82f6" text-anchor="middle">总参数（全部专家）</text>
    <text x="152" y="196" font-size="10" fill="#64748b" text-anchor="middle">模型规模上限</text>

    <rect x="248" y="136" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="328" y="160" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">~48B</text>
    <text x="328" y="182" font-size="11" fill="#16a34a" text-anchor="middle">激活参数（每次推理）</text>
    <text x="328" y="196" font-size="10" fill="#64748b" text-anchor="middle">实际计算量</text>

    <rect x="424" y="136" width="160" height="70" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="504" y="160" font-size="18" font-weight="700" fill="#854d0e" text-anchor="middle">86%↑</text>
    <text x="504" y="182" font-size="11" fill="#a16207" text-anchor="middle">单卡吞吐提升</text>
    <text x="504" y="196" font-size="10" fill="#64748b" text-anchor="middle">FSDP 优化后</text>

    <!-- 对标说明 -->
    <rect x="72" y="222" width="500" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="246" font-size="13" font-weight="600" fill="#0f172a">性能对标区间</text>
    <text x="82" y="268" font-size="12" fill="#64748b">关键 Benchmark 得分介于 Claude Opus 4.8 与 Opus 5 之间</text>
    <text x="82" y="284" font-size="11" fill="#94a3b8">标题写"对标 Opus 5"还是"不及 Opus 5"？取决于选哪个锚点</text>
  </g>
</svg>