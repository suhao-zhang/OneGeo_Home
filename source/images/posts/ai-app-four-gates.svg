<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AI 应用验收四道闸门示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">AI 应用验收 · 四道闸门</text>
    <text x="72" y="114" font-size="14" fill="#64748b">腾讯云开发者社区 · 20 条检查项</text>

    <!-- 四道闸门 -->
    <rect x="72" y="136" width="116" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="130" y="160" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">闸门 1</text>
    <text x="130" y="180" font-size="11" fill="#3b82f6" text-anchor="middle">功能正确性</text>
    <text x="130" y="198" font-size="10" fill="#64748b" text-anchor="middle">答得对不对</text>

    <rect x="200" y="136" width="116" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="258" y="160" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">闸门 2</text>
    <text x="258" y="180" font-size="11" fill="#16a34a" text-anchor="middle">安全合规性</text>
    <text x="258" y="198" font-size="10" fill="#64748b" text-anchor="middle">会不会泄露数据</text>

    <rect x="328" y="136" width="116" height="80" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="386" y="160" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">闸门 3</text>
    <text x="386" y="180" font-size="11" fill="#a16207" text-anchor="middle">性能稳定性</text>
    <text x="386" y="198" font-size="10" fill="#64748b" text-anchor="middle">延迟波动大不大</text>

    <rect x="456" y="136" width="116" height="80" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="514" y="160" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">闸门 4</text>
    <text x="514" y="180" font-size="11" fill="#be185d" text-anchor="middle">成本可控性</text>
    <text x="514" y="198" font-size="10" fill="#64748b" text-anchor="middle">Token 费用涨不涨</text>

    <!-- GEO 视角 -->
    <rect x="72" y="232" width="500" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="254" font-size="13" font-weight="600" fill="#0f172a">GEO 视角：验收标准也要结构化</text>
    <text x="82" y="274" font-size="12" fill="#64748b">"通过了验收"是模糊表述；"四道闸门全部通过，20 条检查项零 Critical"才是可引用事实</text>
  </g>
</svg>