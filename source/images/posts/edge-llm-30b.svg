<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="30B 大模型手机端运行口径拆解">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">"30B" 怎么数的</text>
    <text x="72" y="112" font-size="15" fill="#64748b">参数量、量化精度、实际占用——三个不同的数字</text>

    <!-- 三个对比栏 -->
    <rect x="72" y="136" width="156" height="160" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="150" y="164" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">参数量</text>
    <text x="150" y="196" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">30B</text>
    <text x="150" y="220" font-size="12" fill="#64748b" text-anchor="middle">300 亿参数</text>
    <rect x="92" y="240" width="116" height="6" rx="3" fill="#bfdbfe"/>
    <rect x="92" y="254" width="80" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
    <text x="150" y="280" font-size="11" fill="#1e40af" text-anchor="middle">标题常用</text>

    <rect x="244" y="136" width="156" height="160" rx="10" fill="#fefce8" stroke="#fde047"/>
    <text x="322" y="164" font-size="14" font-weight="600" fill="#a16207" text-anchor="middle">量化精度</text>
    <text x="322" y="196" font-size="28" font-weight="700" fill="#ca8a04" text-anchor="middle">Q4</text>
    <text x="322" y="220" font-size="12" fill="#64748b" text-anchor="middle">4-bit 量化压缩</text>
    <rect x="264" y="240" width="116" height="6" rx="3" fill="#fef08a"/>
    <rect x="264" y="254" width="80" height="6" rx="3" fill="#fef08a" opacity="0.6"/>
    <text x="322" y="280" font-size="11" fill="#a16207" text-anchor="middle">正文才出现</text>

    <rect x="416" y="136" width="156" height="160" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="494" y="164" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">实际占用</text>
    <text x="494" y="196" font-size="28" font-weight="700" fill="#16a34a" text-anchor="middle">~18GB</text>
    <text x="494" y="220" font-size="12" fill="#64748b" text-anchor="middle">Q4 下内存需求</text>
    <rect x="436" y="240" width="116" height="6" rx="3" fill="#bbf7d0"/>
    <rect x="436" y="254" width="80" height="6" rx="3" fill="#bbf7d0" opacity="0.6"/>
    <text x="494" y="280" font-size="11" fill="#166534" text-anchor="middle">用户关心的</text>
  </g>
</svg>
