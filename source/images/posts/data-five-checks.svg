<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="数据到手后的五步体检示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="36" y="36" width="568" height="288" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="68" y="80" font-size="22" font-weight="700" fill="#0f172a">五步体检：从数据表到页面数字</text>
    <text x="68" y="105" font-size="14" fill="#64748b">缺失 · 偏态 · 异常值 · 共线，页面里同样存在</text>

    <g>
      <rect x="68" y="132" width="94" height="70" rx="10" fill="#2563eb"/>
      <text x="115" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1 体检表</text>
      <text x="115" y="182" font-size="11" fill="#dbeafe" text-anchor="middle">类型与缺失</text>

      <rect x="178" y="132" width="94" height="70" rx="10" fill="#2563eb"/>
      <text x="225" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2 缺失原因</text>
      <text x="225" y="182" font-size="11" fill="#dbeafe" text-anchor="middle">分组看分布</text>

      <rect x="288" y="132" width="94" height="70" rx="10" fill="#0ea5e9"/>
      <text x="335" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3 数字形状</text>
      <text x="335" y="182" font-size="11" fill="#e0f2fe" text-anchor="middle">偏度与分位</text>

      <rect x="398" y="132" width="94" height="70" rx="10" fill="#0ea5e9"/>
      <text x="445" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4 异常行</text>
      <text x="445" y="182" font-size="11" fill="#e0f2fe" text-anchor="middle">IQR / Z-score</text>

      <rect x="508" y="132" width="94" height="70" rx="10" fill="#0284c7"/>
      <text x="555" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5 算关系</text>
      <text x="555" y="182" font-size="11" fill="#e0f2fe" text-anchor="middle">相关与 VIF</text>

      <path d="M162 167h12M272 167h12M382 167h12M492 167h12" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <g font-size="12" fill="#475569">
      <text x="68" y="236">页面版对应：</text>
      <text x="68" y="258">没单位 = 结构性缺失</text>
      <text x="68" y="278">量级不一致 = 异常行</text>
      <text x="260" y="258">总价 = 单价 × 数量 = 共线</text>
      <text x="260" y="278">增速缺基数 = 关系断掉</text>
    </g>

    <rect x="68" y="290" width="534" height="22" rx="6" fill="#eff6ff"/>
    <text x="80" y="305" font-size="12" fill="#1d4ed8">原文示例：总价与单价共线、面积单位混用——这两类错在网页正文里是常态</text>
  </g>
</svg>
