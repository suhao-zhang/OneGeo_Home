<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="智能算力 2592 EFLOPS 数字口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">2,592 EFLOPS · 同比 +146%</text>
    <text x="72" y="114" font-size="14" fill="#64748b">工信部 2026 年 10 月公布 · 截至 2026 年 9 月</text>

    <!-- EFLOPS 解释条 -->
    <rect x="72" y="136" width="220" height="60" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="82" y="158" font-size="13" font-weight="600" fill="#1d4ed8">EFLOPS = 百亿亿次/秒</text>
    <text x="82" y="180" font-size="12" fill="#3b82f6">1 EFLOPS = 10^18 FLOPS</text>

    <!-- 对比条 -->
    <rect x="312" y="136" width="256" height="60" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="322" y="158" font-size="13" font-weight="600" fill="#166534">2025 年同期 ≈ 1,054 EFLOPS</text>
    <text x="322" y="180" font-size="12" fill="#16a34a">一年净增 ≈ 1,538 EFLOPS</text>

    <!-- 标题口径对比 -->
    <text x="72" y="228" font-size="14" font-weight="600" fill="#0f172a">同一数字的两种标题</text>
    <rect x="72" y="240" width="240" height="32" rx="6" fill="#2563eb"/>
    <text x="82" y="262" font-size="12" fill="#ffffff">智能算力规模达 2592 EFLOPS</text>
    <rect x="328" y="240" width="240" height="32" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="338" y="262" font-size="12" fill="#dc2626">算力暴增 146%！全球第一</text>

    <text x="72" y="300" font-size="12" fill="#64748b">前者给出绝对值与时间基准，后者只给增速百分比、省略基数——模型引用时口径漂移的典型场景</text>
  </g>
</svg>