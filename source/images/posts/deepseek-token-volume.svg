<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="DeepSeek V4.1-Flash 全球调用量登顶">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">33.6 万亿 Token · 全球第一</text>
    <text x="72" y="112" font-size="15" fill="#64748b">调用量登顶，但"Token"怎么数的？</text>

    <!-- 柱状图 -->
    <rect x="100" y="260" width="60" height="40" rx="4" fill="#93c5fd"/>
    <text x="130" y="285" font-size="11" fill="#1e40af" text-anchor="middle">GPT</text>

    <rect x="180" y="230" width="60" height="70" rx="4" fill="#93c5fd"/>
    <text x="210" y="270" font-size="11" fill="#1e40af" text-anchor="middle">Claude</text>

    <rect x="260" y="200" width="60" height="100" rx="4" fill="#93c5fd"/>
    <text x="290" y="255" font-size="11" fill="#1e40af" text-anchor="middle">Gemini</text>

    <rect x="340" y="150" width="60" height="150" rx="4" fill="#3b82f6"/>
    <text x="370" y="230" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">DeepSeek</text>
    <text x="370" y="145" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="600">33.6T</text>

    <!-- 右侧说明 -->
    <rect x="430" y="140" width="150" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="505" y="166" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">口径要点</text>
    <text x="446" y="190" font-size="11" fill="#334155">· 周调用量非月</text>
