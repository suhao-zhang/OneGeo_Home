<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="卫星互联网低轨组网与产业内容可达性">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">低轨组网 · 内容组网</text>
    <text x="72" y="112" font-size="15" fill="#64748b">卫星在天上连成网，内容在地上被 AI 找到</text>

    <!-- 卫星轨道 -->
    <ellipse cx="320" cy="180" rx="220" ry="60" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- 卫星们 -->
    <g fill="#3b82f6">
      <circle cx="120" cy="160" r="6"/><rect x="110" y="154" width="4" height="12" rx="1" fill="#60a5fa"/>
      <circle cx="220" cy="130" r="6"/><rect x="210" y="124" width="4" height="12" rx="1" fill="#60a5fa"/>
      <circle cx="320" cy="120" r="6"/><rect x="310" y="114" width="4" height="12" rx="1" fill="#60a5fa"/>
      <circle cx="420" cy="130" r="6"/><rect x="410" y="124" width="4" height="12" rx="1" fill="#60a5fa"/>
      <circle cx="520" cy="160" r="6"/><rect x="510" y="154" width="4" height="12" rx="1" fill="#60a5fa"/>
    </g>

    <!-- 连接线 -->
    <g stroke="#93c5fd" stroke-width="1" opacity="0.5">
      <line x1="126" y1="160" x2="214" y2="130"/>
      <line x1="226" y1="130" x2="314" y2="120"/>
      <line x1="326" y1="120" x2="414" y2="130"/>
      <line x1="426" y1="130" x2="514" y2="160"/>
    </g>

    <!-- 地面内容 -->
    <rect x="140" y="220" width="360" height="72" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="320" y="244" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">产业内容结构化</text>
    <text x="320" y="266" font-size="12" fill="#334155" text-anchor="middle">技术参数 · 应用场景 · 产业链图谱 · 可抓取文档</text>
    <text x="320" y="282" font-size="12" fill="#64748b" text-anchor="middle">让 AI 在回答"卫星互联网产业链"时引用你</text>
  </g>
</svg>
