<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="OpenAI 科学突破与同行评审缺失问题">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">三大突破 · 未经评审</text>
    <text x="72" y="112" font-size="15" fill="#64748b">AI 发布的成果，AI 引用时信谁？</text>

    <!-- 三个领域 -->
    <rect x="72" y="136" width="160" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="152" y="160" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">数学</text>
    <text x="152" y="182" font-size="12" fill="#334155" text-anchor="middle">局部光滑猜想</text>
    <text x="152" y="200" font-size="11" fill="#64748b" text-anchor="middle">Lean 形式化验证 ✓</text>

    <rect x="248" y="136" width="160" height="80" rx="10" fill="#fefce8" stroke="#fde047"/>
    <text x="328" y="160" font-size="14" font-weight="600" fill="#a16207" text-anchor="middle">计算机科学</text>
    <text x="328" y="182" font-size="12" fill="#334155" text-anchor="middle">推翻指数时间假设</text>
    <text x="328" y="200" font-size="11" fill="#64748b" text-anchor="middle">Lean 形式化验证 ✓</text>

    <rect x="424" y="136" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="504" y="160" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">物理学</text>
    <text x="504" y="182" font-size="12" fill="#334155" text-anchor="middle">杨-米尔斯存在性</text>
    <text x="504" y="200" font-size="11" fill="#64748b" text-anchor="middle">Lean 形式化验证 ✓</text>

    <!-- 底部问题 -->
    <rect x="72" y="236" width="512" height="68" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="88" y="260" font-size="13" font-weight="600" fill="#991b1b">核心争议</text>
    <text x="88" y="282" font-size="12" fill="#334155">三项成果均完成 Lean 形式化验证，但未经独立同行评审</text>
    <text x="88" y="300" font-size="12" fill="#334155">学界不满发布方式 · 模型引用时无法判断可信度层级</text>
  </g>
</svg>
