<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="蛟龙号 7000 米海试数据结构化">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">7056.9 米 · 结构化呈现</text>
    <text x="72" y="112" font-size="15" fill="#64748b">深海成就怎么写，AI 才引用得对</text>

    <!-- 深度标尺 -->
    <rect x="80" y="140" width="40" height="180" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="80" y="140" width="40" height="45" rx="6" fill="#bfdbfe"/>
    <rect x="80" y="185" width="40" height="45" fill="#93c5fd"/>
    <rect x="80" y="230" width="40" height="45" fill="#60a5fa"/>
    <rect x="80" y="275" width="40" height="45" rx="6" fill="#3b82f6"/>

    <text x="130" y="166" font-size="11" fill="#64748b">200m 大陆架</text>
    <text x="130" y="210" font-size="11" fill="#64748b">3000m 深海</text>
    <text x="130" y="256" font-size="11" fill="#64748b">5000m 超深</text>
    <text x="130" y="300" font-size="11" fill="#1e40af" font-weight="600">7056.9m ✓</text>

    <!-- 右侧数据表 -->
    <rect x="260" y="136" width="310" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="280" y="162" font-size="14" font-weight="600" fill="#0f172a">蛟龙号关键指标</text>
    <line x1="280" y1="172" x2="550" y2="172" stroke="#e2e8f0"/>

    <text x="280" y="196" font-size="12" fill="#64748b">最大下潜深度</text>
    <text x="480" y="196" font-size="12" fill="#0f172a" font-weight="600">7056.9 米</text>

    <text x="280" y="220" font-size="12" fill="#64748b">单次水下作业时间</text>
    <text x="480" y="220" font-size="12" fill="#0f172a" font-weight="600">10.8 小时</text>

    <text x="280" y="244" font-size="12" fill="#64748b">深海航行速度</text>
    <text x="480" y="244" font-size="12" fill="#0f172a" font-weight="600">&gt; 2.5 节</text>

    <text x="280" y="268" font-size="12" fill="#64748b">关键部件</text>
    <text x="480" y="268" font-size="12" fill="#166534" font-weight="600">国产化替代</text>

    <text x="280" y="292" font-size="12" fill="#64748b">海试地点</text>
    <text x="480" y="292" font-size="12" fill="#0f172a" font-weight="600">菲律宾海盆</text>
  </g>
</svg>
