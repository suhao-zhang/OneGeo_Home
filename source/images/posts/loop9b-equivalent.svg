<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="商汤 Loop-9B 等效性能口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">Loop-9B · "9B 达到 27B 性能"</text>
    <text x="72" y="114" font-size="14" fill="#64748b">商汤开源 · 循环 Transformer · 等效口径怎么算</text>

    <!-- 对比条 -->
    <rect x="72" y="140" width="160" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="152" y="168" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle">9B</text>
    <text x="152" y="194" font-size="12" fill="#3b82f6" text-anchor="middle">实际参数量</text>

    <text x="248" y="180" font-size="20" fill="#94a3b8">≈</text>

    <rect x="272" y="140" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="352" y="168" font-size="22" font-weight="700" fill="#166534" text-anchor="middle">27B</text>
    <text x="352" y="194" font-size="12" fill="#16a34a" text-anchor="middle">等效性能级别</text>

    <!-- 等效口径说明 -->
    <rect x="72" y="226" width="500" height="70" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="82" y="250" font-size="13" font-weight="600" fill="#854d0e">"等效"是怎么算的？——三种可能的基准</text>
    <text x="82" y="272" font-size="12" fill="#a16207">① 同一 Benchmark 得分持平 ② 同一任务推理成本对比 ③ 人类评估偏好一致率</text>
    <text x="82" y="288" font-size="11" fill="#92400e">不同基准下"等效"的含义完全不同，模型引用时必须注明用的是哪种</text>
  </g>
</svg>