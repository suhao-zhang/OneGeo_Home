<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="6G 三大新技能与 GEO 内容可达性">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">6G 三大技能 · 内容三要素</text>
    <text x="72" y="112" font-size="15" fill="#64748b">网络在进化，内容结构化也要跟上</text>

    <!-- 三个技能 -->
    <rect x="72" y="136" width="160" height="100" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="152" y="162" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">自带算力</text>
    <text x="152" y="184" font-size="12" fill="#334155" text-anchor="middle">响应 700ms</text>
    <text x="152" y="202" font-size="12" fill="#334155" text-anchor="middle">vs 本地 7s</text>
    <text x="152" y="224" font-size="11" fill="#64748b" text-anchor="middle">差近 10 倍</text>

    <rect x="248" y="136" width="160" height="100" rx="10" fill="#fefce8" stroke="#fde047"/>
    <text x="328" y="162" font-size="14" font-weight="600" fill="#a16207" text-anchor="middle">自带感知</text>
    <text x="328" y="184" font-size="12" fill="#334155" text-anchor="middle">信号 = 雷达</text>
    <text x="328" y="202" font-size="12" fill="#334155" text-anchor="middle">亚米级感知</text>
    <text x="328" y="224" font-size="11" fill="#64748b" text-anchor="middle">通感一体</text>

    <rect x="424" y="136" width="160" height="100" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="504" y="162" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">协同通信</text>
    <text x="504" y="184" font-size="12" fill="#334155" text-anchor="middle">覆盖 = 5G×10</text>
    <text x="504" y="202" font-size="12" fill="#334155" text-anchor="middle">连得远</text>
    <text x="504" y="224" font-size="11" fill="#64748b" text-anchor="middle">2030 商用</text>

    <!-- 底部 GEO 对应 -->
    <rect x="72" y="252" width="512" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="88" y="274" font-size="12" font-weight="600" fill="#0f172a">GEO 对应：每个"技能"都需要可抓取的页面来承载具体数据</text>
    <text x="88" y="294" font-size="11" fill="#64748b">700ms · 亚米级 · 10 倍覆盖——这些数字要出现在 HTML 表格里，模型才能准确引用</text>
  </g>
</svg>
