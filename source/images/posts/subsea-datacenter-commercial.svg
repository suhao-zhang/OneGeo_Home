<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="水下数据中心商用示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">水下数据中心 · 从试验到商用</text>
    <text x="72" y="114" font-size="14" fill="#64748b">上海临港 · 海上风电供能 · 2026 年全面商用</text>

    <!-- 水面线 -->
    <line x1="72" y1="160" x2="568" y2="160" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="572" y="164" font-size="11" fill="#3b82f6">海平面</text>

    <!-- 水面上：风电 -->
    <rect x="120" y="126" width="60" height="34" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="150" y="148" font-size="11" fill="#166534" text-anchor="middle">海上风电</text>

    <!-- 水面下：数据中心 -->
    <rect x="200" y="180" width="240" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="320" y="210" font-size="14" font-weight="600" fill="#1d4ed8" text-anchor="middle">海底数据中心舱体</text>
    <text x="320" y="232" font-size="12" fill="#3b82f6" text-anchor="middle">LLM 推理 + 科学计算</text>
    <text x="320" y="248" font-size="11" fill="#64748b" text-anchor="middle">自然冷却 · 零淡水消耗 · 低 PUE</text>

    <!-- 右侧优势标签 -->
    <rect x="460" y="180" width="100" height="24" rx="12" fill="#dbeafe"/>
    <text x="510" y="196" font-size="11" fill="#1d4ed8" text-anchor="middle">低延迟冷却</text>
    <rect x="460" y="210" width="100" height="24" rx="12" fill="#dcfce7"/>
    <text x="510" y="226" font-size="11" fill="#166534" text-anchor="middle">零淡水消耗</text>
    <rect x="460" y="240" width="100" height="24" rx="12" fill="#fef3c7"/>
    <text x="510" y="256" font-size="11" fill="#854d0e" text-anchor="middle">PUE 更低</text>

    <text x="72" y="300" font-size="12" fill="#64748b">国内头部运营商与 AI 模型公司已入驻，运行大模型推理与科学计算负载</text>
  </g>
</svg>