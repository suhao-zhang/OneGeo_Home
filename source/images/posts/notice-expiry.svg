<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="时效型政务公告的生效与失效区间示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">时效公告 · 状态要成句</text>
    <text x="72" y="118" font-size="16" fill="#64748b">公告早已结束，抓取器仍按"现在"复述</text>

    <!-- 时间轴 -->
    <line x1="80" y1="200" x2="332" y2="200" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="120" y="188" width="52" height="24" rx="6" fill="#fecaca"/>
    <rect x="196" y="188" width="72" height="24" rx="6" fill="#fecaca"/>
    <text x="120" y="236" font-size="13" fill="#dc2626">9/25–27</text>
    <text x="196" y="236" font-size="13" fill="#dc2626">10/1–7</text>
    <text x="80" y="164" font-size="14" fill="#334155">暂停办理（公告日 2026-09-24）</text>
    <circle cx="300" cy="200" r="7" fill="#2563eb"/>
    <text x="282" y="266" font-size="13" fill="#1d4ed8">10/26 抓取：仍列首页第一条</text>

    <!-- 右侧三行写法 -->
    <g>
      <rect x="376" y="152" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="167" font-size="15" fill="#334155">生效时间</text>
      <rect x="376" y="192" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="207" font-size="15" fill="#334155">失效时间</text>
      <rect x="376" y="232" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="247" font-size="15" fill="#334155">当前状态一句</text>
      <rect x="376" y="272" width="18" height="18" rx="5" fill="#0ea5e9"/>
      <text x="404" y="287" font-size="15" fill="#334155">与恢复公告互链</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M360 161h8M360 201h8M360 241h8M360 281h8"/>
    </g>
  </g>
</svg>
