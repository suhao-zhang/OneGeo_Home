<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="RAG 企业级落地四道关示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">Demo → 上线：四道关</text>
    <text x="72" y="112" font-size="15" fill="#64748b">向量库选对了，RAG 还是死在 Demo</text>

    <!-- 四道关卡 -->
    <g>
      <!-- Gate 1 -->
      <rect x="72" y="140" width="108" height="140" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
      <circle cx="126" cy="172" r="20" fill="#3b82f6" opacity="0.15"/>
      <text x="126" y="178" font-size="18" fill="#2563eb" text-anchor="middle">1</text>
      <text x="126" y="210" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">向量库</text>
      <text x="126" y="228" font-size="11" fill="#64748b" text-anchor="middle">选型与调优</text>
      <rect x="88" y="244" width="76" height="6" rx="3" fill="#bfdbfe"/>
      <rect x="88" y="256" width="56" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>

      <!-- Gate 2 -->
      <rect x="200" y="140" width="108" height="140" rx="10" fill="#f0fdf4" stroke="#86efac"/>
      <circle cx="254" cy="172" r="20" fill="#22c55e" opacity="0.15"/>
      <text x="254" y="178" font-size="18" fill="#16a34a" text-anchor="middle">2</text>
      <text x="254" y="210" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">数据管道</text>
      <text x="254" y="228" font-size="11" fill="#64748b" text-anchor="middle">清洗与分块</text>
      <rect x="216" y="244" width="76" height="6" rx="3" fill="#bbf7d0"/>
      <rect x="216" y="256" width="56" height="6" rx="3" fill="#bbf7d0" opacity="0.6"/>

      <!-- Gate 3 -->
      <rect x="328" y="140" width="108" height="140" rx="10" fill="#fefce8" stroke="#fde047"/>
      <circle cx="382" cy="172" r="20" fill="#eab308" opacity="0.15"/>
      <text x="382" y="178" font-size="18" fill="#ca8a04" text-anchor="middle">3</text>
      <text x="382" y="210" font-size="13" font-weight="600" fill="#a16207" text-anchor="middle">评估框架</text>
      <rect x="344" y="228" width="76" height="6" rx="3" fill="#fef08a"/>
      <rect x="344" y="240" width="56" height="6" rx="3" fill="#fef08a" opacity="0.6"/>
      <text x="382" y="264" font-size="11" fill="#64748b" text-anchor="middle">召回 + 生成</text>

      <!-- Gate 4 -->
      <rect x="456" y="140" width="108" height="140" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="510" cy="172" r="20" fill="#ef4444" opacity="0.15"/>
      <text x="510" y="178" font-size="18" fill="#dc2626" text-anchor="middle">4</text>
      <text x="510" y="210" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">生产扩展</text>
      <rect x="472" y="244" width="76" height="6" rx="3" fill="#fecaca"/>
      <rect x="472" y="256" width="56" height="6" rx="3" fill="#fecaca" opacity="0.6"/>
    </g>

    <!-- 连接箭头 -->
    <g fill="none" stroke="#94a3b8" stroke-width="1.5">
      <path d="M182 210h16" marker-end="url(#arrowR)"/>
      <path d="M310 210h16" marker-end="url(#arrowR)"/>
      <path d="M438 210h16" marker-end="url(#arrowR)"/>
    </g>
    <defs>
      <marker id="arrowR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <path d="M0 0 L6 2.5 L0 5" fill="#94a3b8"/>
      </marker>
    </defs>
  </g>
</svg>
