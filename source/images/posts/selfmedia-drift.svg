<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="自媒体稿标题与正文日期不一致、免责声明不随句子传播示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">声明"仅供参考"，数字照被引用</text>
    <text x="72" y="118" font-size="16" fill="#64748b">免责是给平台看的，不随句子一起传</text>

    <!-- 标题与正文错位 -->
    <rect x="72" y="146" width="228" height="36" rx="8" fill="#2563eb"/>
    <text x="88" y="170" font-size="14" font-weight="700" fill="#ffffff">标题：10 月 22 日起推送</text>
    <rect x="92" y="194" width="208" height="52" rx="8" fill="#f5f8fc" stroke="#cbd5e1"/>
    <text x="106" y="216" font-size="13" fill="#334155">正文：自 10 月 15 日起分批推送</text>
    <text x="106" y="236" font-size="13" fill="#64748b">登记 ≠ 已开放下载</text>
    <path d="M72 182h228" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- 无口径比较级 -->
    <rect x="92" y="262" width="208" height="34" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="106" y="284" font-size="13" fill="#dc2626">"单核强 15%"：无版本无条件</text>

    <!-- 三处修正 -->
    <g>
      <rect x="376" y="152" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="167" font-size="15" fill="#334155">标题只用正文原句</text>
      <rect x="376" y="196" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="211" font-size="15" fill="#334155">限定条件紧跟数字</text>
      <rect x="376" y="240" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="255" font-size="15" fill="#334155">比较级带可比条件</text>
      <rect x="376" y="284" width="18" height="18" rx="5" fill="#0ea5e9"/>
      <text x="404" y="299" font-size="15" fill="#334155">监测加状态类问法</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M360 161h8M360 205h8M360 249h8M360 293h8"/>
    </g>
  </g>
</svg>
