<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Agent 权限管理与代码复核">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">Agent 改了代码，谁复核</text>
    <text x="72" y="112" font-size="15" fill="#64748b">权限请求 → 代码变更 → 人类验证</text>

    <!-- Agent 角色 -->
    <rect x="72" y="140" width="140" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="142" cy="180" r="24" fill="#3b82f6" opacity="0.15"/>
    <text x="142" y="186" font-size="20" fill="#2563eb" text-anchor="middle">A</text>
    <text x="142" y="224" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">AI Agent</text>
    <text x="142" y="246" font-size="12" fill="#64748b" text-anchor="middle">请求权限</text>
    <text x="142" y="264" font-size="12" fill="#64748b" text-anchor="middle">修改代码</text>
    <text x="142" y="282" font-size="12" fill="#64748b" text-anchor="middle">提交变更</text>

    <!-- 箭头 -->
    <path d="M220 220 L268 220" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowA)"/>
    <defs>
      <marker id="arrowA" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <path d="M0 0 L6 2.5 L0 5" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- 审核层 -->
    <rect x="276" y="140" width="140" height="160" rx="12" fill="#fefce8" stroke="#fde047"/>
    <circle cx="346" cy="180" r="24" fill="#eab308" opacity="0.15"/>
    <text x="346" y="186" font-size="20" fill="#ca8a04" text-anchor="middle">R</text>
    <text x="346" y="224" font-size="14" font-weight="600" fill="#a16207" text-anchor="middle">Review</text>
    <text x="346" y="246" font-size="12" fill="#64748b" text-anchor="middle">检查 diff</text>
    <text x="346" y="264" font-size="12" fill="#64748b" text-anchor="middle">验证意图</text>
    <text x="346" y="282" font-size="12" fill="#64748b" text-anchor="middle">确认合并</text>

    <!-- 箭头 -->
    <path d="M424 220 L472 220" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowA)"/>

    <!-- 结果 -->
    <rect x="480" y="140" width="90" height="160" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="525" cy="180" r="24" fill="#22c55e" opacity="0.15"/>
    <text x="525" y="186" font-size="20" fill="#16a34a" text-anchor="middle">&#x2713;</text>
    <text x="525" y="224" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">安全</text>
    <text x="525" y="246" font-size="12" fill="#64748b" text-anchor="middle">变更可控</text>
    <text x="525" y="264" font-size="12" fill="#64748b" text-anchor="middle">意图一致</text>
  </g>
</svg>
