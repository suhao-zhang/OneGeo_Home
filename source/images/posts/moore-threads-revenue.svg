<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="摩尔线程 Q3 财报数字口径拆解">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">1773.9% · 怎么读</text>
    <text x="72" y="112" font-size="15" fill="#64748b">高增长数字背后，基线在哪里？</text>

    <!-- 左侧：标题数字 -->
    <rect x="72" y="136" width="230" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="187" y="166" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">标题里的数字</text>
    <text x="187" y="210" font-size="36" font-weight="700" fill="#2563eb" text-anchor="middle">1773.9%</text>
    <text x="187" y="240" font-size="13" fill="#334155" text-anchor="middle">同比增长</text>
    <text x="187" y="270" font-size="12" fill="#64748b" text-anchor="middle">Q3 营收 15.5 亿元</text>

    <!-- 右侧：完整口径 -->
    <rect x="330" y="136" width="240" height="160" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="450" y="162" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">完整口径</text>

    <text x="346" y="190" font-size="12" fill="#334155">Q3 单季营收：15.5 亿元</text>
    <text x="346" y="212" font-size="12" fill="#334155">Q3 去年同期：约 0.82 亿元</text>
    <text x="346" y="234" font-size="12" fill="#334155">前三季度累计：32.9 亿元</text>
    <text x="346" y="256" font-size="12" fill="#334155">前三季度同比：+319%</text>
    <text x="346" y="278" font-size="12" fill="#166534" font-weight="600">净利润：4926 万元（扭亏）</text>
  </g>
</svg>
