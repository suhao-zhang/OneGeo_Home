<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="页面从能被读懂到能被调用的三层准备示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">从能被读懂 → 能被调用</text>
    <text x="72" y="118" font-size="16" fill="#64748b">WebMCP：页面自己声明能力与参数</text>

    <!-- 浏览器框 -->
    <rect x="72" y="146" width="256" height="146" rx="10" fill="#f5f8fc" stroke="#cbd5e1"/>
    <rect x="72" y="146" width="256" height="24" rx="10" fill="#e2e8f0"/>
    <circle cx="88" cy="158" r="4" fill="#94a3b8"/>
    <circle cx="102" cy="158" r="4" fill="#94a3b8"/>
    <rect x="92" y="184" width="120" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="92" y="204" width="164" height="12" rx="6" fill="#e2e8f0"/>
    <g>
      <rect x="92" y="232" width="30" height="20" rx="6" fill="#2563eb"/>
      <rect x="130" y="232" width="30" height="20" rx="6" fill="#2563eb"/>
      <rect x="168" y="232" width="30" height="20" rx="6" fill="#bfdbfe"/>
      <rect x="206" y="232" width="30" height="20" rx="6" fill="#e2e8f0"/>
    </g>
    <text x="92" y="278" font-size="12" fill="#64748b">能力插槽：已声明 / 未声明</text>

    <!-- 三层准备 -->
    <g>
      <rect x="376" y="152" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="167" font-size="15" fill="#334155">字段与实体命名统一</text>
      <rect x="376" y="200" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="215" font-size="15" fill="#334155">"能做什么"写成段落</text>
      <rect x="376" y="248" width="18" height="18" rx="5" fill="#0ea5e9"/>
      <text x="404" y="263" font-size="15" fill="#334155">可编程入口（长期）</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M360 161h8M360 209h8M360 257h8"/>
    </g>
    <text x="376" y="296" font-size="12" fill="#94a3b8">Chrome for Testing 151 实验阶段</text>
  </g>
</svg>
