<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="一条聚合早报拆成事实单元与三种失真模式示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">一条早报 · 五个事实单元</text>
    <text x="72" y="118" font-size="16" fill="#64748b">每个单元都会被单独摘走</text>

    <!-- 早报栏 -->
    <rect x="72" y="146" width="150" height="150" rx="10" fill="#f5f8fc" stroke="#cbd5e1"/>
    <g fill="#2563eb">
      <rect x="88" y="164" width="118" height="14" rx="7"/>
      <rect x="88" y="188" width="96" height="14" rx="7" fill="#93c5fd"/>
      <rect x="88" y="212" width="110" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="88" y="236" width="84" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="88" y="260" width="100" height="14" rx="7" fill="#e2e8f0"/>
    </g>

    <!-- 三种失真 -->
    <g>
      <rect x="256" y="160" width="16" height="16" rx="5" fill="#dc2626"/>
      <text x="282" y="174" font-size="15" fill="#334155">合并失真</text>
      <text x="282" y="194" font-size="13" fill="#64748b">439 / 799 / 1199 → "439 元"</text>

      <rect x="256" y="216" width="16" height="16" rx="5" fill="#dc2626"/>
      <text x="282" y="230" font-size="15" fill="#334155">时态失真</text>
      <text x="282" y="250" font-size="13" fill="#64748b">"已完成收购" → "拟收购"</text>

      <rect x="256" y="272" width="16" height="16" rx="5" fill="#dc2626"/>
      <text x="282" y="286" font-size="15" fill="#334155">消息源失真</text>
    </g>

    <g font-size="13" fill="#1d4ed8">
      <text x="470" y="174">盯住三处</text>
      <text x="470" y="200" fill="#64748b">官网原始事实源</text>
      <text x="470" y="226" fill="#64748b">聚合类监测问法</text>
      <text x="470" y="252" fill="#64748b">一次性更正沟通</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M454 168h8M454 194h8M454 220h8M454 246h8"/>
    </g>
  </g>
</svg>
