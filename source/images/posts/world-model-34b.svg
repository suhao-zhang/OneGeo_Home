<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="34B 世界模型单卡运行的性能口径">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">"实时" 怎么定义</text>
    <text x="72" y="112" font-size="15" fill="#64748b">34B 世界模型单卡 5090 跑起来的"实时"是几帧？</text>

    <!-- GPU 卡 -->
    <rect x="72" y="140" width="160" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="92" y="160" width="120" height="50" rx="6" fill="#dbeafe"/>
    <text x="152" y="185" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">RTX 5090</text>
    <text x="152" y="202" font-size="11" fill="#3b82f6" text-anchor="middle">24GB VRAM</text>
    <text x="152" y="256" font-size="12" fill="#64748b" text-anchor="middle">单卡 · 消费级</text>

    <!-- 箭头 -->
    <path d="M240 190 L290 190" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowH)"/>
    <defs>
      <marker id="arrowH" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <path d="M0 0 L6 2.5 L0 5" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- 模型 -->
    <rect x="298" y="140" width="120" height="100" rx="12" fill="#fefce8" stroke="#fde047"/>
    <text x="358" y="175" font-size="20" font-weight="700" fill="#ca8a04" text-anchor="middle">34B</text>
    <text x="358" y="198" font-size="12" fill="#a16207" text-anchor="middle">世界模型</text>
    <text x="358" y="256" font-size="12" fill="#64748b" text-anchor="middle">Scenes AI</text>

    <!-- 箭头 -->
    <path d="M426 190 L476 190" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowH)"/>

    <!-- 结果 -->
    <rect x="484" y="140" width="90" height="100" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="529" y="175" font-size="16" font-weight="700" fill="#16a34a" text-anchor="middle">?fps</text>
    <text x="529" y="198" font-size="12" fill="#166534" text-anchor="middle">"实时"</text>
    <text x="529" y="256" font-size="12" fill="#64748b" text-anchor="middle">需确认帧率</text>

    <!-- 底部问题 -->
    <rect x="72" y="272" width="502" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="323" y="295" font-size="13" fill="#991b1b" text-anchor="middle">关键问题：30fps？15fps？5fps？"实时"的定义决定了这个数字的意义</text>
  </g>
</svg>
