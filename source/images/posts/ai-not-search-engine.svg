<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AI vs 搜索引擎定位差异示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">别把 AI 当搜索引擎用</text>
    <text x="72" y="114" font-size="14" fill="#64748b">少数派文章 · 两种工具的定位差异</text>

    <!-- 对比表 -->
    <rect x="72" y="136" width="240" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="192" y="160" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">搜索引擎</text>
    <text x="82" y="184" font-size="12" fill="#3b82f6">✓ 返回链接列表</text>
    <text x="82" y="204" font-size="12" fill="#3b82f6">✓ 用户自行判断可信度</text>
    <text x="82" y="224" font-size="12" fill="#3b82f6">✓ 可追溯原始出处</text>
    <text x="82" y="244" font-size="12" fill="#3b82f6">✓ 实时索引最新内容</text>

    <rect x="328" y="136" width="240" height="120" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="448" y="160" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">AI 大模型</text>
    <text x="338" y="184" font-size="12" fill="#a16207">✓ 生成综合性回答</text>
    <text x="338" y="204" font-size="12" fill="#a16207">✗ 可能产生幻觉/编造</text>
    <text x="338" y="224" font-size="12" fill="#a16207">✗ 来源不可追溯</text>
    <text x="338" y="244" font-size="12" fill="#a16207">✗ 知识有截止日期</text>

    <!-- GEO 启示 -->
    <rect x="72" y="270" width="500" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="82" y="294" font-size="12" fill="#166534">GEO 的核心任务：让 AI 在生成回答时能引用到你的原始内容——补上"来源可追溯"这一环</text>
  </g>
</svg>