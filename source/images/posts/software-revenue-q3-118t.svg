<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Q1-Q3 软件收入 11.8 万亿口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">11.8 万亿 · 前三季度软件收入</text>
    <text x="72" y="114" font-size="14" fill="#64748b">工信部 2026-10-31 公布 · 细分领域增速分化</text>

    <!-- 四个细分 -->
    <rect x="72" y="140" width="116" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="130" y="164" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">+23.3%</text>
    <text x="130" y="184" font-size="10" fill="#3b82f6" text-anchor="middle">IC 设计</text>
    <text x="130" y="198" font-size="9" fill="#64748b" text-anchor="middle">增速最快</text>

    <rect x="200" y="140" width="116" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="258" y="164" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">+10.2%</text>
    <text x="258" y="184" font-size="10" fill="#16a34a" text-anchor="middle">云/大数据</text>
    <text x="258" y="198" font-size="9" fill="#64748b" text-anchor="middle">服务类</text>

    <rect x="328" y="140" width="116" height="70" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="386" y="164" font-size="16" font-weight="700" fill="#854d0e" text-anchor="middle">+10.3%</text>
    <text x="386" y="184" font-size="10" fill="#a16207" text-anchor="middle">嵌入式系统</text>
    <text x="386" y="198" font-size="9" fill="#64748b" text-anchor="middle">软件类</text>

    <rect x="456" y="140" width="116" height="70" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="514" y="164" font-size="16" font-weight="700" fill="#9d174d" text-anchor="middle">+12.2%</text>
    <text x="514" y="184" font-size="10" fill="#be185d" text-anchor="middle">软件出口</text>
    <text x="514" y="198" font-size="9" fill="#64748b" text-anchor="middle">外包类</text>

    <!-- 总量 -->
    <rect x="72" y="224" width="500" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="250" font-size="14" font-weight="600" fill="#0f172a">总量 11.8 万亿 · 同比 +8.4% · IC 设计增速是整体近 3 倍</text>

    <text x="72" y="292" font-size="12" fill="#64748b">"软件行业增长 8.4%"掩盖了结构分化——IC 设计 23.3% 的增速才是产业方向信号</text>
  </g>
</svg>