<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="GEO 假信源风险名录：真假来源对比示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">假信源 vs 真信源</text>
    <text x="72" y="112" font-size="15" fill="#64748b">模型引用的 300+ 风险频道，第一步是识别</text>

    <!-- 左侧：风险信源 -->
    <rect x="72" y="136" width="220" height="160" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <circle cx="112" cy="170" r="16" fill="#ef4444" opacity="0.15"/>
    <text x="112" y="175" font-size="16" fill="#dc2626" text-anchor="middle">!</text>
    <text x="138" y="174" font-size="14" font-weight="600" fill="#991b1b">仿冒域名</text>
    <rect x="88" y="196" width="180" height="8" rx="4" fill="#fecaca"/>
    <rect x="88" y="212" width="140" height="8" rx="4" fill="#fecaca" opacity="0.7"/>
    <rect x="88" y="228" width="160" height="8" rx="4" fill="#fecaca" opacity="0.5"/>
    <text x="88" y="264" font-size="12" fill="#b91c1c">品牌冒用 · 内容洗稿 · 域名近似</text>

    <!-- 右侧：可信信源 -->
    <rect x="340" y="136" width="220" height="160" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="380" cy="170" r="16" fill="#22c55e" opacity="0.15"/>
    <text x="380" y="175" font-size="16" fill="#16a34a" text-anchor="middle">&#x2713;</text>
    <text x="406" y="174" font-size="14" font-weight="600" fill="#166534">官方来源</text>
    <rect x="356" y="196" width="180" height="8" rx="4" fill="#bbf7d0"/>
    <rect x="356" y="212" width="140" height="8" rx="4" fill="#bbf7d0" opacity="0.7"/>
    <rect x="356" y="228" width="160" height="8" rx="4" fill="#bbf7d0" opacity="0.5"/>
    <text x="356" y="264" font-size="12" fill="#15803d">一手公告 · 可核对字段 · 可抓取</text>

    <!-- 中间箭头 -->
    <path d="M300 216 L332 216" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
    <defs>
      <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <path d="M0 0 L8 3 L0 6" fill="#94a3b8"/>
      </marker>
    </defs>
  </g>
</svg>
