<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="轨迹断言三层示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="36" y="36" width="568" height="288" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="68" y="80" font-size="22" font-weight="700" fill="#0f172a">测最终答案，还是测整条轨迹</text>
    <text x="68" y="105" font-size="14" fill="#64748b">三层断言：来源、路径、复述一致性</text>

    <g>
      <rect x="68" y="128" width="300" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="80" y="148" font-size="12" fill="#334155">{"step":1,"tool":"retrieve","args":{"q":"..."}}</text>
      <rect x="68" y="164" width="300" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="80" y="184" font-size="12" fill="#334155">{"step":2,"tool":"open","args":{"url":"..."}}</text>
      <rect x="68" y="200" width="300" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="80" y="220" font-size="12" fill="#334155">{"step":3,"tool":"answer","args":{"claim":"..."}}</text>
    </g>

    <g>
      <rect x="400" y="126" width="172" height="46" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="414" y="146" font-size="12" font-weight="700" fill="#1d4ed8">第 1 层 · 来源</text>
      <text x="414" y="164" font-size="11" fill="#475569">域名是否在清单里</text>

      <rect x="400" y="182" width="172" height="46" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="414" y="202" font-size="12" font-weight="700" fill="#1d4ed8">第 2 层 · 路径</text>
      <text x="414" y="220" font-size="11" fill="#475569">先检索，且带上条件</text>

      <rect x="400" y="238" width="172" height="46" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="414" y="258" font-size="12" font-weight="700" fill="#1d4ed8">第 3 层 · 一致</text>
      <text x="414" y="276" font-size="11" fill="#475569">数字与单位对得上原文</text>
    </g>

    <text x="68" y="258" font-size="12" fill="#64748b">JSONL 一行一步，可版本化、可回归</text>
    <text x="68" y="280" font-size="12" fill="#64748b">"只断言最终态，测的是运气"</text>
    <text x="68" y="306" font-size="12" fill="#1d4ed8">蒙对也是一次失败：过程错了，下次就复现不出来</text>
  </g>
</svg>
