<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="标题数字与正文数字不同口径的对照示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">标题一个数，正文另一个数</text>
    <text x="72" y="118" font-size="16" fill="#64748b">被抓走的是标题，可核对的是正文</text>

    <!-- 标题条 -->
    <rect x="72" y="146" width="252" height="40" rx="8" fill="#2563eb"/>
    <text x="88" y="172" font-size="16" font-weight="700" fill="#ffffff">标题：提速 40%</text>
    <text x="88" y="208" font-size="13" fill="#dc2626">正文检索：未出现"40%"</text>

    <!-- 正文句 -->
    <rect x="72" y="222" width="252" height="70" rx="8" fill="#f5f8fc" stroke="#cbd5e1"/>
    <text x="88" y="248" font-size="14" fill="#334155">TPOT 14.22ms → 7.8ms</text>
    <text x="88" y="272" font-size="14" fill="#334155">并发 c=1 · 下降 45.1%</text>

    <!-- 三件套 -->
    <g>
      <rect x="376" y="152" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="167" font-size="15" fill="#334155">指标名（不是"提速"）</text>
      <rect x="376" y="196" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="211" font-size="15" fill="#334155">条件（并发 / 长度）</text>
      <rect x="376" y="240" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="255" font-size="15" fill="#334155">基线与对比原值</text>
      <rect x="376" y="284" width="18" height="18" rx="5" fill="#0ea5e9"/>
      <text x="404" y="299" font-size="15" fill="#334155">标题数字可回查</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M360 161h8M360 205h8M360 249h8M360 293h8"/>
    </g>
  </g>
</svg>
