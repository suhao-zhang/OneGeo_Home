<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="数字政府高效办成一件事与 GEO 可达性">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">高效办成一件事 · 内容可达</text>
    <text x="72" y="112" font-size="15" fill="#64748b">政务系统升级了，AI 能读到吗？</text>

    <!-- 左侧：政务系统 -->
    <rect x="72" y="136" width="200" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="172" y="166" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">政务平台</text>
    <line x1="92" y1="178" x2="252" y2="178" stroke="#bfdbfe"/>

    <rect x="92" y="192" width="160" height="24" rx="6" fill="#dbeafe"/>
    <text x="172" y="209" font-size="12" fill="#1e40af" text-anchor="middle">企业登记全程电子化</text>

    <rect x="92" y="224" width="160" height="24" rx="6" fill="#dbeafe"/>
    <text x="172" y="241" font-size="12" fill="#1e40af" text-anchor="middle">高效办成一件事专区</text>

    <rect x="92" y="256" width="160" height="24" rx="6" fill="#dbeafe"/>
    <text x="172" y="273" font-size="12" fill="#1e40af" text-anchor="middle">系统升级公告</text>

    <!-- 中间：抓取器 -->
    <g transform="translate(310, 190)">
      <circle cx="0" cy="26" r="28" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
      <text x="0" y="22" font-size="11" fill="#a16207" text-anchor="middle">AI</text>
      <text x="0" y="36" font-size="11" fill="#a16207" text-anchor="middle">爬虫</text>
    </g>

    <!-- 连接：虚线 -->
    <path d="M280 220 L300 220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <path d="M346 220 L380 220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowE)"/>
    <defs>
      <marker id="arrowE" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <path d="M0 0 L6 2.5 L0 5" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- 右侧：结果 -->
    <rect x="388" y="136" width="180" height="160" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="478" y="166" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">用户问 AI</text>
    <line x1="408" y1="178" x2="548" y2="178" stroke="#bbf7d0"/>

    <text x="408" y="202" font-size="12" fill="#334155">"河南怎么办营业执照"</text>
    <text x="408" y="226" font-size="12" fill="#334155">"企业登记全程电子化"</text>
    <text x="408" y="250" font-size="12" fill="#334155">"高效办成一件事怎么用"</text>

    <rect x="408" y="264" width="140" height="20" rx="4" fill="#dcfce7"/>
    <text x="478" y="279" font-size="11" fill="#166534" text-anchor="middle">需要可抓取的政务内容</text>
  </g>
</svg>
