<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Qwen3.8 参数规模命名口径">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="86" font-size="24" font-weight="700" fill="#0f172a">2.4T · 哪个 2.4T</text>
    <text x="72" y="112" font-size="15" fill="#64748b">同一个数字，五种不同含义</text>

    <!-- 五种口径 -->
    <rect x="72" y="136" width="500" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="88" y="159" font-size="13" fill="#1e40af" font-weight="600">总参数量</text>
    <text x="240" y="159" font-size="13" fill="#334155">2.4T（MoE 所有专家参数之和）</text>

    <rect x="72" y="180" width="500" height="36" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="88" y="203" font-size="13" fill="#a16207" font-weight="600">激活参数</text>
    <text x="240" y="203" font-size="13" fill="#334155">每次推理实际使用的参数（远小于 2.4T）</text>

    <rect x="72" y="224" width="500" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="88" y="247" font-size="13" fill="#166534" font-weight="600">Max 版本</text>
    <text x="240" y="247" font-size="13" fill="#334155">Qwen3.8-Max 可能是最大配置</text>

    <rect x="72" y="268" width="500" height="36" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <text x="88" y="291" font-size="13" fill="#6d28d9" font-weight="600">开源版本</text>
    <text x="240" y="291" font-size="13" fill="#334155">开源的可能不是最大版本</text>
  </g>
</svg>
