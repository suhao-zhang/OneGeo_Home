<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Elasticsearch 9.2 集成知识索引的权限示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="36" y="36" width="568" height="288" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="68" y="80" font-size="22" font-weight="700" fill="#0f172a">一个没有 delete 的知识索引</text>
    <text x="68" y="105" font-size="14" fill="#64748b">Elasticsearch 9.2 · .integration_knowledge</text>

    <g>
      <ellipse cx="176" cy="150" rx="74" ry="18" fill="#e0f2fe" stroke="#7dd3fc"/>
      <path d="M102 150v74c0 10 33 18 74 18s74-8 74-18v-74" fill="#f0f9ff" stroke="#7dd3fc"/>
      <ellipse cx="176" cy="224" rx="74" ry="18" fill="none" stroke="#7dd3fc"/>
      <text x="176" y="196" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">AI 集成知识</text>
      <text x="176" y="214" font-size="11" fill="#0284c7" text-anchor="middle">Fleet · 助手上下文</text>
    </g>

    <g>
      <rect x="304" y="136" width="126" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
      <text x="367" y="158" font-size="13" fill="#15803d" text-anchor="middle">read</text>
      <rect x="304" y="180" width="126" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
      <text x="367" y="202" font-size="13" fill="#15803d" text-anchor="middle">write</text>
      <rect x="304" y="224" width="126" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
      <text x="367" y="246" font-size="13" fill="#15803d" text-anchor="middle">create_index</text>

      <rect x="448" y="180" width="126" height="34" rx="17" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="511" y="202" font-size="13" fill="#b91c1c" text-anchor="middle">delete</text>
      <path d="M452 197l118 0" stroke="#b91c1c" stroke-width="3"/>
    </g>

    <text x="304" y="124" font-size="12" fill="#64748b">权限清单</text>
    <text x="68" y="286" font-size="12" fill="#475569">只增不删 → 过期不是删除，是新增一条"已作废"的记录</text>
    <text x="68" y="308" font-size="12" fill="#64748b">站点对应：保留 URL，顶部说明替代关系，dateModified 同步更新</text>
  </g>
</svg>
