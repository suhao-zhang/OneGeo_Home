<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="PDF 转成 Markdown 的结构还原示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="36" y="36" width="568" height="288" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="68" y="80" font-size="22" font-weight="700" fill="#0f172a">PDF 是版面，Markdown 是结构</text>
    <text x="68" y="105" font-size="14" fill="#64748b">转换工具做的是把坐标还原成语义</text>

    <g>
      <rect x="68" y="128" width="152" height="164" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="82" y="150" font-size="13" font-weight="700" fill="#b91c1c">PDF</text>
      <rect x="82" y="162" width="108" height="8" rx="4" fill="#fca5a5"/>
      <rect x="82" y="178" width="96" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="82" y="190" width="112" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="82" y="206" width="124" height="46" rx="4" fill="#ffffff" stroke="#fca5a5"/>
      <path d="M82 216h124M82 228h124M113 206v46M144 206v46M175 206v46" stroke="#fca5a5"/>
      <rect x="82" y="262" width="104" height="6" rx="3" fill="#e2e8f0"/>
      <text x="82" y="284" font-size="11" fill="#94a3b8">双栏 / 表格 / 扫描件</text>
    </g>

    <path d="M236 210h44" stroke="#94a3b8" stroke-width="3"/>
    <path d="M276 202l10 8-10 8z" fill="#94a3b8"/>
    <text x="234" y="196" font-size="11" fill="#64748b">版面分析</text>

    <g>
      <rect x="292" y="128" width="280" height="164" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="308" y="150" font-size="13" font-weight="700" fill="#15803d">Markdown</text>
      <text x="308" y="176" font-size="15" font-weight="700" fill="#0f172a"># 白皮书标题</text>
      <text x="308" y="198" font-size="12" fill="#475569">## 关键结论</text>
      <rect x="308" y="208" width="120" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="308" y="220" width="200" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="308" y="240" width="236" height="40" rx="4" fill="#ffffff" stroke="#86efac"/>
      <path d="M308 253h236M308 266h236M368 240v40M446 240v40" stroke="#86efac"/>
      <text x="312" y="292" font-size="11" fill="#94a3b8">标题层级 / 段落 / 可解析表格</text>
    </g>

    <text x="68" y="314" font-size="12" fill="#64748b">输出 md / json / zip；standard 偏表格，advanced 偏标题与图（原文实测档位）</text>
  </g>
</svg>
