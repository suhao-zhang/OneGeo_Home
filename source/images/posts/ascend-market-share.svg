<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="华为昇腾市场份额反超英伟达口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">昇腾反超英伟达 · 按什么口径算？</text>
    <text x="72" y="114" font-size="14" fill="#64748b">华为披露 · 中国 AI 芯片市场份额</text>

    <!-- 三种口径 -->
    <rect x="72" y="140" width="160" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="152" y="164" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">口径 A</text>
    <text x="152" y="184" font-size="12" fill="#3b82f6" text-anchor="middle">按出货量（颗数）</text>
    <text x="152" y="202" font-size="11" fill="#64748b" text-anchor="middle">昇腾量大但单价低</text>

    <rect x="248" y="140" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="328" y="164" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">口径 B</text>
    <text x="328" y="184" font-size="12" fill="#16a34a" text-anchor="middle">按营收额（元）</text>
    <text x="328" y="202" font-size="11" fill="#64748b" text-anchor="middle">英伟达单价高营收可能仍领先</text>

    <rect x="424" y="140" width="160" height="80" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="504" y="164" font-size="13" font-weight="600" fill="#854d0e" text-anchor="middle">口径 C</text>
    <text x="504" y="184" font-size="12" fill="#a16207" text-anchor="middle">按算力（EFLOPS）</text>
    <text x="504" y="202" font-size="11" fill="#64748b" text-anchor="middle">单卡算力英伟达仍领先</text>

    <!-- 底部说明 -->
    <rect x="72" y="236" width="500" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="258" font-size="13" font-weight="600" fill="#0f172a">"反超"成立的前提</text>
    <text x="82" y="278" font-size="12" fill="#64748b">只有口径 A（出货量）下反超最可能成立；口径 B/C 下英伟达可能仍领先</text>
  </g>
</svg>