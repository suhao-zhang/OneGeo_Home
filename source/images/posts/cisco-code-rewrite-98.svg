<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="程序员重写思科代码数字口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">"98%" 与 "两个月" · 两组待核数字</text>
    <text x="72" y="114" font-size="14" fill="#64748b">博客园热文 · 27 岁程序员获无限 Token 重写思科遗留代码</text>

    <!-- 数字卡片 -->
    <rect x="72" y="136" width="150" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="147" y="166" font-size="24" font-weight="700" fill="#1d4ed8" text-anchor="middle">98%</text>
    <text x="147" y="190" font-size="12" fill="#3b82f6" text-anchor="middle">代码重写比例</text>

    <rect x="240" y="136" width="150" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="315" y="166" font-size="24" font-weight="700" fill="#166534" text-anchor="middle">2 个月</text>
    <text x="315" y="190" font-size="12" fill="#16a34a" text-anchor="middle">完成时间</text>

    <rect x="408" y="136" width="160" height="72" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="488" y="166" font-size="24" font-weight="700" fill="#854d0e" text-anchor="middle">∞ Token</text>
    <text x="488" y="190" font-size="12" fill="#a16207" text-anchor="middle">API 额度（无限量）</text>

    <!-- GEO 检查清单 -->
    <text x="72" y="238" font-size="14" font-weight="600" fill="#0f172a">GEO 口径检查</text>
    <text x="82" y="260" font-size="12" fill="#16a34a">✓ 98% 是代码行数比例还是文件比例？</text>
    <text x="82" y="280" font-size="12" fill="#16a34a">✓ "重写"指完全替换还是 AI 辅助重构？</text>
    <text x="82" y="300" font-size="12" fill="#dc2626">✗ 原文未给出验证方式，模型无法判断可信度</text>
  </g>
</svg>