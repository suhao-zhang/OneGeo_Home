<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Prompt 注入红队回归集示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">Prompt 注入 · 红队回归集</text>
    <text x="72" y="114" font-size="14" fill="#64748b">阿里云开发者社区文章 · 给大模型应用建安全测试集</text>

    <!-- 流程图 -->
    <!-- 1. 收集攻击 -->
    <rect x="72" y="140" width="120" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="132" y="162" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">收集攻击样本</text>
    <text x="132" y="178" font-size="10" fill="#dc2626" text-anchor="middle">红队测试发现</text>

    <!-- 箭头 1 -->
    <path d="M192 165 L212 165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <defs><marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0 0, 6 2, 0 4" fill="#94a3b8"/></marker></defs>

    <!-- 2. 结构化 -->
    <rect x="212" y="140" width="120" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="272" y="162" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">结构化标注</text>
    <text x="272" y="178" font-size="10" fill="#3b82f6" text-anchor="middle">攻击类型 + 目标</text>

    <!-- 箭头 2 -->
    <path d="M332 165 L352 165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- 3. 回归集 -->
    <rect x="352" y="140" width="120" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="412" y="162" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">回归测试集</text>
    <text x="412" y="178" font-size="10" fill="#16a34a" text-anchor="middle">CI/CD 门禁</text>

    <!-- 箭头 3 -->
    <path d="M472 165 L492 165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- 4. 部署 -->
    <rect x="492" y="140" width="80" height="50" rx="8" fill="#fefce8" stroke="#fde68a"/>
    <text x="532" y="162" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">部署</text>
    <text x="532" y="178" font-size="10" fill="#a16207" text-anchor="middle">通过上线</text>

    <!-- 下方说明 -->
    <rect x="72" y="210" width="500" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="234" font-size="13" font-weight="600" fill="#0f172a">GEO 视角：安全内容也要结构化</text>
    <text x="82" y="256" font-size="12" fill="#64748b">"Prompt 注入防护"是一个模糊表述，模型无法引用。</text>
    <text x="82" y="274" font-size="12" fill="#64748b">"建立红队回归集，含 X 类攻击、Y 条样本，CI 门禁拦截率 Z%"——每个数字都可核对。</text>
  </g>
</svg>