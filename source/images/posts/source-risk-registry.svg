<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="风险信源名录与信源资产清单五字段示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">先能存活，再谈引用</text>
    <text x="72" y="118" font-size="16" fill="#64748b">官网负责保存，第三方负责传播</text>

    <!-- 六层链路 -->
    <g>
      <rect x="72" y="146" width="60" height="34" rx="8" fill="#2563eb"/>
      <rect x="140" y="146" width="60" height="34" rx="8" fill="#3b82f6"/>
      <rect x="208" y="146" width="60" height="34" rx="8" fill="#60a5fa"/>
      <rect x="276" y="146" width="60" height="34" rx="8" fill="#7dd3fc"/>
      <rect x="344" y="146" width="60" height="34" rx="8" fill="#bae6fd"/>
      <rect x="412" y="146" width="60" height="34" rx="8" fill="#e0f2fe"/>
      <g font-size="12" fill="#0f172a" text-anchor="middle">
        <text x="102" y="167" fill="#ffffff">存活</text>
        <text x="170" y="167" fill="#ffffff">召回</text>
        <text x="238" y="167" fill="#ffffff">读取</text>
        <text x="306" y="167">使用</text>
        <text x="374" y="167">引用</text>
        <text x="442" y="167">推荐</text>
      </g>
    </g>
    <text x="72" y="204" font-size="13" fill="#64748b">首批名录：306 台风险主机 · 951 条目录项 · 263 个疑似变体站群</text>

    <!-- 五字段清单 -->
    <g>
      <rect x="72" y="222" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="100" y="237" font-size="15" fill="#334155">URL 与发布平台账号</text>
      <rect x="72" y="256" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="100" y="271" font-size="15" fill="#334155">首次 / 最后验证日期</text>
      <rect x="72" y="290" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="100" y="305" font-size="15" fill="#334155">官网原始页与口径版本号</text>
    </g>
    <g font-size="13" fill="#1d4ed8">
      <text x="404" y="237">判据只有一条：</text>
      <text x="404" y="261" fill="#334155">三年后还打得开吗</text>
      <text x="404" y="285" fill="#334155">打开还是这个口径吗</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M388 231h8M388 255h8M388 279h8"/>
    </g>
  </g>
</svg>
