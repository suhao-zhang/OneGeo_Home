<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="水星3号推理速度数字口径示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="88" font-size="22" font-weight="700" fill="#0f172a">1,068 token/s · 水星 3 号实测速度</text>
    <text x="72" y="114" font-size="14" fill="#64748b">腾讯云开发者社区文章 · 关键问题：什么条件下的 1068？</text>

    <!-- 测试条件四行 -->
    <rect x="72" y="136" width="240" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="82" y="160" font-size="13" font-weight="600" fill="#1d4ed8">测试条件（需逐项确认）</text>
    <text x="82" y="182" font-size="12" fill="#3b82f6">模型参数量：？</text>
    <text x="82" y="200" font-size="12" fill="#3b82f6">Batch Size：？</text>
    <text x="82" y="218" font-size="12" fill="#3b82f6">并发数 / 输入长度：？</text>

    <!-- 速度对比 -->
    <rect x="328" y="136" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="338" y="160" font-size="13" font-weight="600" fill="#166534">同类参考速度</text>
    <text x="338" y="182" font-size="12" fill="#16a34a">昇腾 910C：特定 batch 下提速 40%</text>
    <text x="338" y="200" font-size="12" fill="#16a34a">RTX 4090：~80 token/s（单用户）</text>
    <text x="338" y="218" font-size="12" fill="#16a34a">H100 SXM：~200 token/s（单用户）</text>

    <!-- 标题口径对比 -->
    <text x="72" y="264" font-size="14" font-weight="600" fill="#0f172a">同一数字的两种标题</text>
    <rect x="72" y="276" width="240" height="28" rx="6" fill="#2563eb"/>
    <text x="82" y="296" font-size="11" fill="#ffffff">特定条件下实测 1068 token/s</text>
    <rect x="328" y="276" width="240" height="28" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="338" y="296" font-size="11" fill="#dc2626">最快！推理速度破千 token/s</text>
  </g>
</svg>