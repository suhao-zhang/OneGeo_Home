<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="同一模型两种参数口径与口径四件套示意">
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="40" y="40" width="560" height="280" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="90" font-size="24" font-weight="700" fill="#0f172a">一次发布 · 两套说法</text>
    <text x="72" y="118" font-size="16" fill="#64748b">模型不会判断哪个是官方原文</text>

    <!-- 两张口径卡 -->
    <rect x="72" y="146" width="124" height="62" rx="10" fill="#f5f8fc" stroke="#cbd5e1"/>
    <text x="134" y="176" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">2.8T</text>
    <text x="134" y="196" font-size="12" fill="#64748b" text-anchor="middle">活跃 1040 亿</text>

    <rect x="212" y="146" width="124" height="62" rx="10" fill="#f5f8fc" stroke="#cbd5e1"/>
    <text x="274" y="176" font-size="18" font-weight="700" fill="#0ea5e9" text-anchor="middle">3 万亿</text>
    <text x="274" y="196" font-size="12" fill="#64748b" text-anchor="middle">媒体舍入表述</text>

    <path d="M196 232h140" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <path d="M134 208v24h140v-24M274 208v24" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <rect x="150" y="252" width="176" height="42" rx="20" fill="#2563eb"/>
    <text x="238" y="278" font-size="14" fill="#ffffff" text-anchor="middle">AI 回答里只剩一个</text>

    <!-- 口径四件套 -->
    <g>
      <rect x="376" y="150" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="165" font-size="15" fill="#334155">模型标识 kimi-k3.1-pro</text>
      <rect x="376" y="192" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="207" font-size="15" fill="#334155">参数写完整形式</text>
      <rect x="376" y="234" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="249" font-size="15" fill="#334155">时间用绝对日期</text>
      <rect x="376" y="276" width="18" height="18" rx="5" fill="#2563eb"/>
      <text x="404" y="291" font-size="15" fill="#334155">价格带单位与条件</text>
    </g>
    <g fill="none" stroke="#bfdbfe" stroke-width="2">
      <path d="M360 159h8M360 201h8M360 243h8M360 285h8"/>
    </g>
  </g>
</svg>
