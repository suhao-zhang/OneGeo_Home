# ============================================================
#  OneGeo —— 主题配置覆盖（hexo-theme-xongyi）
#
#  OneGeo 是新乡洹拓科技有限公司旗下的 GEO（Generative Engine
#  Optimization，生成式引擎优化）研究与服务项目，本站是该项目官网。
#
#  本文件与 themes/hexo-theme-xongyi/_config.yml 深度合并，日常只改这里。
#  注意 Hexo 的数组是按下标合并、不会整体替换，所以给数组就要给全。
#
#  【待填】/【待确认】= 需要你提供的真实信息，我没有替你编。
#  配套清单见项目根目录《待填素材清单.md》。
# ============================================================

## 预设风格：enterprise 商务蓝 / government 政务红 / education 学院青
preset: enterprise

# ------------------------------------------------------------
# 品牌：OneGeo 是项目品牌，法律主体是新乡洹拓科技有限公司
# ------------------------------------------------------------
brand:
  name: "OneGeo"                 # 项目名，导航左上角与页脚显示
  slogan: "让内容被 AI 看见、读懂、引用"   # 【待确认】这句是我按 GEO 含义起的草稿，你定稿
  logo: "/images/logo.svg"       # 【待替换】洹拓的 logo 图里有"洹拓科技"字样，不能直接拿来用
  favicon: "/images/favicon.svg" # 【待替换】同上

# ------------------------------------------------------------
# 顶部导航
# 主题已支持二级菜单：给某项加 children 即成下拉
#   - { name: "关于", url: "/about/", children: [ { name: "发展历程", url: "/about/history/" } ] }
# 现在四个页面都是平级，先用扁平结构；子页建好后按上面写法加
# ------------------------------------------------------------
menu:
  - { name: "首页", url: "/" }
  - { name: "关于 OneGeo", url: "/about/" }
  - { name: "GEO 服务", url: "/services/" }
  - { name: "研究动态", url: "/news/" }
  - { name: "联系我们", url: "/contact/" }

nav_button:
  name: "咨询 GEO"
  url: "/contact/"

# ------------------------------------------------------------
# 首页板块顺序（加进列表即显示，顺序即上下顺序）
#   hero / quicklinks / stats / services / about / products / news /
#   team / partners / gallery / cta / contact / about-contact
# ------------------------------------------------------------
sections:
  - hero
  - services
  - news
  - cta
  - about-contact

## 以下板块需要真实素材才能上线，已双保险关闭（不在 sections 里 + enable: false）
## 打开前务必先填对应节点，否则是空标题
stats:
  enable: false                  # 数字要能举证（监测覆盖多少个引擎、多长时间周期等）
  items: []
team:
  enable: false                  # 需要真实成员姓名/职务/照片
  items: []
partners:
  enable: false                  # 客户与合作机构需授权，不能凭空列
  items: []
gallery:
  enable: false                  # 需要实拍图
  items: []
products:
  enable: false                  # 有可公开的研究成果/报告/工具后再开
  items: []
  link: { name: "查看全部", url: "/services/" }
quicklinks:
  enable: false
  items: []

# ------------------------------------------------------------
# hero 首屏（title 支持 <em> 高亮与 <br> 换行）
# ------------------------------------------------------------
hero:
  badge: "新乡洹拓科技有限公司 · GEO 研究与优化"
  title: "让内容被 AI 引用<br><em>【待填：一句价值主张】</em>"
  subtitle: "【待填：60~80 字。建议写清你为哪类站点做 GEO、用什么方法、交付什么——避免承诺具体排名或引用率】"
  buttons:
    - { name: "了解 OneGeo", url: "/about/", primary: true }
    - { name: "GEO 服务", url: "/services/" }
  image: "/images/hero.svg"      # 【待替换】主题占位插图，建议换成真实监测界面/流程图
  image_alt: ""                  # 【待填】换成真实配图后写描述，图片搜索与 AI 抓取都要靠它

# ------------------------------------------------------------
# services —— GEO 项目的能力条目
# 每条描述的是「打算怎么做」，能不能做、做到什么程度请你确认后定稿
# ------------------------------------------------------------
services:
  title: "GEO 能做什么"
  subtitle: "【待填：一句话概括服务边界】"
  items:
    - { icon: "search",    title: "AI 可见性诊断", desc: "【待确认：查站点在生成式引擎里能否被抓取与引用，覆盖哪些引擎由你定】", url: "/services/" }
    - { icon: "file-text", title: "内容结构化", desc: "【待确认：标题层级、FAQ、Schema、llms.txt 等让机器好读的结构改造】", url: "/services/" }
    - { icon: "settings",  title: "抓取可达性", desc: "【待确认：robots.txt 放行策略、sitemap、服务端渲染与静态化】", url: "/services/" }
    - { icon: "trending-up", title: "引用监测", desc: "【待确认：是否提供周期性引用与来源统计，用什么口径】", url: "/services/" }
    - { icon: "chart",     title: "效果度量", desc: "【待确认：度量指标与报告形式；没有基线数据前不要写提升百分比】", url: "/services/" }
    - { icon: "users",     title: "咨询与培训", desc: "【待确认：面向谁、几次、交付什么】", url: "/services/" }

# ------------------------------------------------------------
# news 研究动态（自动取最新 N 篇）
# per_page 给 layout/news.ejs 与 scripts/news-pagination.js 共用
# ------------------------------------------------------------
news:
  title: "研究动态"
  subtitle: ""
  count: 3
  per_page: 12                   # /news/ 列表每页条数（超过会自动出 /news/page/2/ …）
  more: { name: "查看全部", url: "/news/" }

# ------------------------------------------------------------
# cta 行动号召条
# ------------------------------------------------------------
cta:
  title: "【待填：号召主句】"
  subtitle: "【待填：响应承诺，别承诺做不到的时限】"
  button: { name: "联系我们", url: "/contact/" }

# ------------------------------------------------------------
# about 关于我们（content 支持 HTML）
# ------------------------------------------------------------
about:
  title: "关于 OneGeo"
  subtitle: "新乡洹拓科技有限公司旗下的 GEO 项目"
  image: "/images/about.svg"
  content: |
    <p>OneGeo 是新乡洹拓科技有限公司旗下的 GEO（Generative Engine Optimization，生成式引擎优化）研究与服务项目，关注同一个问题：内容怎样才能被生成式引擎抓取、理解并作为来源引用。</p>
    <ul>
      <li>【待填：可举证的差异化事实 1，例如自研监测方法、长期发布的实测记录】</li>
      <li>【待填：可举证的差异化事实 2】</li>
    </ul>
  link: { name: "了解更多", url: "/about/" }

# ------------------------------------------------------------
# contact —— 主体是新乡洹拓科技有限公司，联系信息沿用公司官网口径
# 留空的字段主题会自动不渲染，不会显示成空白行
# ------------------------------------------------------------
contact:
  title: "联系我们"
  subtitle: ""
  address: "河南省新乡市辉县市金城百货四楼"
  phone: "400-829-9957"
  hours: "工作日 9:00 - 18:00"
  email: ""                      # 【待填】洹拓站的 contact.email 目前也是空的，定了对外邮箱再填
  wechat: ""                     # 【待填】二维码图片路径，如 /images/wechat.png
  form_action: ""                # 【可选】表单收信地址；留空则不渲染表单
  map: ""                        # 【可选】地图 iframe 嵌入地址

# ------------------------------------------------------------
# 页脚
# ------------------------------------------------------------
footer:
  about: "OneGeo · 新乡洹拓科技有限公司旗下 GEO 研究与优化项目"
  columns:
    - title: "快速导航"
      items:
        - { name: "首页", url: "/" }
        - { name: "关于 OneGeo", url: "/about/" }
        - { name: "研究动态", url: "/news/" }
    - title: "服务与联系"
      items:
        - { name: "GEO 服务", url: "/services/" }
        - { name: "联系我们", url: "/contact/" }
        - { name: "归档", url: "/archives/" }
  copyright: "© 2026 新乡洹拓科技有限公司 · 保留所有权利"
  icp: ""                        # 【待办】备案跟"主体+域名"走：豫ICP备2025140588号 只覆盖 huant.ltd，
                                 #         OneGeo 用新域名要在同一主体下新增域名备案，不能照抄这个号
  icp_url: "https://beian.miit.gov.cn/"
  police: ""                     # 【待办】公安备案号（做过再填）
  police_url: ""
  show_powered: true             # 页脚"由 Hexo 强力驱动 · 主题 Xongyi XFM"；不想要改成 false

social: []
# 需要时这样加（name 会作为悬浮提示与无障碍标签，主题补丁支持）：
# social:
#   - { icon: "mail", name: "邮箱", url: "mailto:你的邮箱" }
#   - { icon: "phone", name: "电话", url: "tel:4008299957" }

# ------------------------------------------------------------
# 功能开关
# ------------------------------------------------------------
features:
  dark_mode: true
  back_to_top: true
  reveal: true
  sticky_header: true
  stats_animation: true

# ------------------------------------------------------------
# SEO（留空回退到站点 _config.yml 的 description / keywords）
# ------------------------------------------------------------
seo:
  description: ""
  keywords: ""
  jsonld: true

# ------------------------------------------------------------
# 统计代码：洹拓站用的是 umami + clarity，本站要不要同一套由你定
# ------------------------------------------------------------
analytics:
  google: ""
  cloudflare: ""
# 洹拓站在 scripts/analytics-providers.js 里扩展了 umami / clarity 两个字段，
# 本站没搬；需要时把那两个脚本一并同步过来。
