# ============================================================
#  OneGeo —— 主题配置覆盖（hexo-theme-xongyi）
#
#  OneGeo 是新乡洹拓科技有限公司旗下的 GEO（Generative Engine
#  Optimization，生成式引擎优化）研究与服务项目，本站是该项目官网。
#
#  本文件与 themes/hexo-theme-xongyi/_config.yml 深度合并。
#  注意 Hexo 的数组是按下标合并、不整体替换，给数组就要给全。
#
#  文案素材来源：洹拓站已公开发布的 GEO 方法论（_config.hexo-theme-xongyi.yml
#  的 services 段与 source/solutions/saas-and-geo/index.md）。客户名单、效果
#  数字、团队人员、备案号仍为空——这些必须由你提供，未编造。
# ============================================================

## 预设风格：enterprise 商务蓝 / government 政务红 / education 学院青
preset: enterprise

# ------------------------------------------------------------
# 品牌
# ------------------------------------------------------------
brand:
  name: "OneGeo"
  slogan: "让品牌在 AI 的回答里被正确引用"
  logo: "/images/onegeo-logo.svg"       # OneGeo 原创字标（自绘 SVG，未使用洹拓 logo 素材）
  favicon: "/images/onegeo-favicon.svg"

# ------------------------------------------------------------
# 顶部导航
# 二级菜单：给某项加 children 即成下拉（主题 header.ejs 已支持）
#   - { name: "关于", url: "/about/", children: [ { name: "发展历程", url: "/about/history/" } ] }
# ------------------------------------------------------------
menu:
  - { name: "首页", url: "/" }
  - { name: "关于 OneGeo", url: "/about/" }
  - { name: "GEO 服务", url: "/services/" }
  - { name: "研究动态", url: "/news/" }
  - { name: "联系我们", url: "/contact/" }

nav_button:
  name: "咨询 GEO"
  url: "/contact/"

# ------------------------------------------------------------
# 首页板块顺序
# ------------------------------------------------------------
sections:
  - hero
  - stats
  - services
  - products
  - news
  - cta
  - about-contact

## 需要真实素材才能上线的板块，保持关闭（不在 sections + enable: false 双保险）
team:
  enable: false                  # 需真实成员姓名/职务/照片
  items: []
partners:
  enable: false                  # 客户与合作机构需授权，不能凭空列
  items: []
gallery:
  enable: false                  # 需实拍图
  items: []
quicklinks:
  enable: false
  items: []

# ------------------------------------------------------------
# hero 首屏
# ------------------------------------------------------------
hero:
  badge: "新乡洹拓科技有限公司 · GEO 研究与优化"
  title: "让品牌被 AI<br><em>检索、引用、推荐</em>"
  subtitle: "GEO 的目标不是排名，而是当用户向 AI 提问时，你的产品被检索到、被引用、被正确描述。OneGeo 做实体一致性、内容结构化、抓取可达性、信源布局与持续监测五件事，用被引用次数、描述准确率与来源分布衡量，不承诺排名。"
  buttons:
    - { name: "了解 OneGeo", url: "/about/", primary: true }
    - { name: "GEO 方法", url: "/services/" }
  image: "/images/onegeo-hero.svg"
  image_alt: "GEO 链路示意图：站点内容经抓取、结构化后被生成式引擎检索，并在回答中作为来源被引用"

# ------------------------------------------------------------
# stats —— 只放站点自身结构的自描述数字，不含任何客户数与效果承诺
# ------------------------------------------------------------
stats:
  items:
    - { value: 5, suffix: " 步", label: "GEO 动作" }
    - { value: 4, suffix: " 类", label: "交付物" }
    - { value: 3, suffix: " 个", label: "衡量口径" }
    - { value: 1, suffix: " 份", label: "优化前基线报告" }

# ------------------------------------------------------------
# services —— 五步方法 + 衡量口径（源自洹拓已公开的方案说明）
# ------------------------------------------------------------
services:
  title: "GEO 怎么做"
  subtitle: "五步动作，一套可核对的衡量口径"
  items:
    - { icon: "tag",        title: "实体一致性", desc: "公司名、产品名与技术术语在站内站外保持同一写法，避免模型把你识别成多个不同主体。", url: "/services/" }
    - { icon: "file-text",  title: "内容结构化", desc: "把「是什么、解决什么问题、与替代方案的区别、价格模式、常见问题」写成清晰可抽取的段落，配合 Schema.org 标记。", url: "/services/" }
    - { icon: "settings",   title: "抓取可达性", desc: "robots.txt 明确放行 AI 抓取器，提供 sitemap 与 llms.txt，正文不依赖 JS 执行才出现。", url: "/services/" }
    - { icon: "globe",      title: "信源布局", desc: "在行业媒体、技术社区、百科与问答等被模型高频引用的位置，留下口径一致的真实内容。", url: "/services/" }
    - { icon: "trending-up", title: "持续监测", desc: "用一组固定问题定期询问主流模型，记录我们是否被提到、描述是否准确，据此调整。", url: "/services/" }
    - { icon: "chart",      title: "衡量口径", desc: "看被引用次数、被描述准确率与来源分布，而不是「第几名」——排名类承诺本身不可验证。", url: "/services/" }

# ------------------------------------------------------------
# products —— 这里放四类交付物（洹拓方案页已公开的交付内容）
# 图为自绘 SVG，未使用洹拓素材
# ------------------------------------------------------------
products:
  title: "交付物"
  subtitle: "每一项都能自己核对"
  items:
    - { image: "/images/deliver-baseline.svg", title: "GEO 基线报告", desc: "优化前用一组固定问题测各模型：现在是否被引用、被描述成什么样。", url: "/services/", tags: ["优化前", "可对照"] }
    - { image: "/images/deliver-structure.svg", title: "内容与结构方案", desc: "站点信息架构、术语表、页面结构化标记与 FAQ 写法。", url: "/services/", tags: ["结构化", "Schema"] }
    - { image: "/images/deliver-actions.svg", title: "优化动作清单", desc: "站内改造与站外信源逐条列出，做完一条勾一条。", url: "/services/", tags: ["站内", "站外"] }
    - { image: "/images/deliver-monthly.svg", title: "月度监测报告", desc: "被提及与描述准确情况、变化幅度与下一步建议。", url: "/services/", tags: ["周期", "趋势"] }
  link:
    name: "查看方法说明"
    url: "/services/"

# ------------------------------------------------------------
# news 研究动态
# ------------------------------------------------------------
news:
  title: "研究动态"
  subtitle: "GEO 方法与 AI 抓取的实操记录"
  count: 3
  per_page: 12                   # /news/ 列表每页条数，超出自动出 /news/page/2/ …
  more: { name: "查看全部", url: "/news/" }

# ------------------------------------------------------------
# cta 行动号召条
# ------------------------------------------------------------
cta:
  title: "先做一次基线，再谈优化"
  subtitle: "用一组固定问题问一遍主流模型，看你现在的引用与描述情况。报告可核对，不承诺排名。"
  button: { name: "联系我们", url: "/contact/" }

# ------------------------------------------------------------
# about 关于我们
# ------------------------------------------------------------
about:
  title: "关于 OneGeo"
  subtitle: "新乡洹拓科技有限公司旗下的 GEO 项目"
  image: "/images/onegeo-about.svg"
  content: |
    <p>OneGeo 是新乡洹拓科技有限公司旗下的 GEO（Generative Engine Optimization，生成式引擎优化）项目。我们不做"排名优化"，做的是让内容被抓到、被读懂、被正确引用：实体一致性、内容结构化、抓取可达性、信源布局、持续监测，五步都能逐条核对。</p>
    <ul>
      <li>衡量口径事先说清：被引用次数、被描述准确率、来源分布</li>
      <li>优化前后用同一组问题、同一批模型测，差值才算数</li>
      <li>站外信源不做假背书——编造媒体引用的代价远大于收益</li>
    </ul>
  link: { name: "了解更多", url: "/about/" }

# ------------------------------------------------------------
# contact —— 主体同为新乡洹拓科技有限公司，联系信息沿用公司官网口径
# 留空字段主题自动不渲染
# ------------------------------------------------------------
contact:
  title: "联系我们"
  subtitle: "欢迎来电或预约面谈"
  address: "河南省新乡市辉县市金城百货四楼"
  phone: "400-829-9957"
  hours: "工作日 9:00 - 18:00"
  email: ""                      # 有对公邮箱再填（洹拓站同样为空）
  wechat: ""                     # 二维码放 source/images/ 后填地址
  form_action: ""                # 接 Formspree 等表单服务后填，留空不渲染表单
  map: ""                        # 高德/百度地图 iframe 嵌入地址

# ------------------------------------------------------------
# 页脚
# ------------------------------------------------------------
footer:
  about: "OneGeo · 新乡洹拓科技有限公司旗下 GEO 研究与优化项目。让品牌在 AI 搜索与大模型回答中被检索、被引用、被正确描述。"
  columns:
    - title: "快速导航"
      items:
        - { name: "首页", url: "/" }
        - { name: "关于 OneGeo", url: "/about/" }
        - { name: "研究动态", url: "/news/" }
    - title: "服务与联系"
      items:
        - { name: "GEO 服务", url: "/services/" }
        - { name: "联系我们", url: "/contact/" }
        - { name: "归档", url: "/archives/" }
  copyright: "© 2026 新乡洹拓科技有限公司 · 保留所有权利"
  icp: ""                        # 备案跟"主体+域名"走：豫ICP备2025140588号 只覆盖 huant.ltd，
                                 # onegeo.cn 需在同一主体下单独完成域名备案后填这里
  icp_url: "https://beian.miit.gov.cn/"
  police: ""
  police_url: ""
  show_powered: true

social:
  - { icon: "phone", name: "电话", url: "tel:4008299957" }
  - { icon: "map-pin", name: "联系我们", url: "/contact/" }

# ------------------------------------------------------------
# 功能开关
# ------------------------------------------------------------
features:
  dark_mode: true
  back_to_top: true
  reveal: true
  sticky_header: true
  stats_animation: true

# ------------------------------------------------------------
# SEO：留空即回退到站点 _config.yml 的 description / keywords
# 站点级那句已按"每页描述必须描述本页"的口径写好，这里不再重复
# ------------------------------------------------------------
seo:
  description: ""
  keywords: ""
  jsonld: true

# ------------------------------------------------------------
# 统计代码：洹拓站用 umami + clarity（走 scripts/analytics-providers.js 扩展），
# 该脚本本次未搬，需要时一并同步再填 ID
# ------------------------------------------------------------
analytics:
  google: ""
  cloudflare: ""
